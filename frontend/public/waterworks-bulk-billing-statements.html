<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Waterworks Bulk Billing Statements</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Times New Roman", Times, Georgia, serif;
    background: #e8ecf1;
    color: #111;
  }
  .controls {
    font-family: system-ui, -apple-system, Segoe UI, Arial, sans-serif;
    padding: 10px 16px;
    background: #f8fafc;
    border-bottom: 1px solid #dbe2ea;
    display: flex;
    align-items: center;
    gap: 8px;
    position: sticky;
    top: 0;
    z-index: 100;
    flex-wrap: wrap;
  }
  .btn {
    padding: 7px 14px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    color: #fff;
    background: #1f6b4a;
  }
  .btn:hover { background: #18573c; }
  .btn:disabled { background: #94a3b8; cursor: not-allowed; }
  .spacer { flex: 1; }
  #loadStatus, #summaryLabel { font-size: 13px; color: #475569; }
  #summaryLabel { font-weight: 600; color: #1e293b; }
  .loading-box, .error-box {
    font-family: system-ui, Arial, sans-serif;
    text-align: center;
    padding: 48px 16px;
    color: #64748b;
  }
  .error-box { color: #b91c1c; }

  #bill-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 8px 40px;
    gap: 16px;
  }
  #bill-wrap.hidden { display: none; }

  .bulk-page {
    width: 210mm;
    height: 297mm;
    background: #fff;
    border: 1px solid #c5cdd8;
    box-shadow: 0 8px 28px rgba(15, 23, 42, 0.08);
    display: flex;
    flex-direction: column;
    page-break-after: always;
    overflow: hidden;
    position: relative;
  }
  .bulk-page::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 6mm;
    right: 6mm;
    border-top: 1px dashed #94a3b8;
    pointer-events: none;
    z-index: 2;
  }
  .statement-wrapper {
    flex: 1 1 50%;
    min-height: 0;
    max-height: 50%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: stretch;
    padding: 4mm 6mm;
    overflow: hidden;
    page-break-inside: avoid;
  }

  .billing-doc {
    width: 100%;
    background: #fff;
    border: none;
    box-shadow: none;
    padding: 0;
    font-size: 11pt;
    line-height: 1.3;
    color: #0f172a;
  }
  .doc-header {
    display: grid;
    grid-template-columns: 72px 1fr 72px;
    align-items: center;
    column-gap: 12px;
    margin-bottom: 14px;
    line-height: 1.4;
    text-align: center;
  }
  .doc-header .logo-left {
    width: 72px;
    height: 72px;
    object-fit: contain;
    display: block;
  }
  .doc-header .logo-spacer { width: 72px; height: 72px; }
  .doc-header .header-text { text-align: center; }
  .doc-header .muni {
    font-size: 15pt;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .doc-header .office {
    font-size: 10.5pt;
    font-weight: 700;
    letter-spacing: 0.03em;
    margin-top: 2px;
    text-transform: uppercase;
  }
  .doc-header .dept {
    font-size: 12.5pt;
    font-weight: 700;
    margin-top: 6px;
    padding-bottom: 8px;
    border-bottom: 2.5px double #0f172a;
    display: inline-block;
    min-width: 78%;
  }
  table.bill {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    border: 1.5px solid #0f172a;
  }
  table.bill td {
    border: 1px solid #1e293b;
    padding: 6px 8px;
    vertical-align: middle;
  }
  table.bill .lbl {
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    font-size: 10pt;
  }
  table.bill .center { text-align: center; }
  table.bill .subhead {
    font-size: 8.5pt;
    font-weight: 700;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #334155;
    margin-bottom: 2px;
  }
  table.bill .section-title {
    background: #f1f5f9;
    font-size: 9.5pt;
    letter-spacing: 0.05em;
    padding-top: 5px;
    padding-bottom: 5px;
  }
  table.bill .field-label { background: #f8fafc; white-space: nowrap; }
  table.bill .field-value { font-size: 11.5pt; font-weight: 600; }
  table.bill .meter-no-cell { background: #f8fafc; line-height: 1.35; }
  table.bill .meter-no-value {
    font-weight: 600;
    font-size: 12pt;
    margin-top: 6px;
  }
  table.bill .collection-cell { background: #f8fafc; }
  table.bill .collection-label { font-weight: 700; text-transform: none; letter-spacing: 0; }
  table.bill .collection-value { float: right; font-weight: 700; font-size: 11.5pt; }
  table.bill .date-value {
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    font-size: 11pt;
  }
  table.bill .amount-cell,
  table.bill .reading-cell {
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    font-size: 11.5pt;
    padding-top: 10px;
    padding-bottom: 10px;
  }
  table.bill .total-cell { font-weight: 700; font-size: 12.5pt; background: #f8fafc; }
  table.bill .col-head {
    background: #f1f5f9;
    font-size: 9pt;
    line-height: 1.25;
    letter-spacing: 0.03em;
  }
  .rate-cell {
    font-size: 10pt;
    line-height: 1.55;
    vertical-align: top !important;
    padding: 10px 10px 12px !important;
  }
  .rate-title {
    display: block;
    font-weight: 700;
    letter-spacing: 0.04em;
    margin-bottom: 6px;
    padding-bottom: 4px;
    border-bottom: 1px solid #cbd5e1;
  }
  .rate-line {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-variant-numeric: tabular-nums;
    padding: 1px 0;
  }
  .rate-line .amt { font-weight: 600; white-space: nowrap; }
  .note-cell { vertical-align: top !important; padding: 10px 12px 14px !important; }
  .note-line { font-size: 10.5pt; margin-bottom: 8px; }
  .sig-block { text-align: center; padding-top: 42px; line-height: 1.35; }
  .sig-name {
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-size: 11.5pt;
    border-top: 1px solid #0f172a;
    display: inline-block;
    min-width: 55%;
    padding-top: 4px;
    margin-top: 28px;
  }
  .sig-title {
    font-size: 9.5pt;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: #334155;
    margin-top: 2px;
  }
  .no-bill-msg {
    margin-top: 8px;
    text-align: center;
    font-family: system-ui, Arial, sans-serif;
    font-size: 9pt;
    color: #64748b;
  }

  /* Compact half-A4 variant */
  .billing-doc-compact {
    font-size: 8pt;
    line-height: 1.2;
  }
  .billing-doc-compact .doc-header {
    grid-template-columns: 42px 1fr 42px;
    column-gap: 6px;
    margin-bottom: 6px;
  }
  .billing-doc-compact .doc-header .logo-left,
  .billing-doc-compact .doc-header .logo-spacer {
    width: 42px;
    height: 42px;
  }
  .billing-doc-compact .doc-header .muni { font-size: 9.5pt; letter-spacing: 0.04em; }
  .billing-doc-compact .doc-header .office { font-size: 7pt; }
  .billing-doc-compact .doc-header .dept {
    font-size: 8.5pt;
    margin-top: 2px;
    padding-bottom: 3px;
    min-width: 70%;
  }
  .billing-doc-compact table.bill { border-width: 1px; }
  .billing-doc-compact table.bill td { padding: 2px 4px; }
  .billing-doc-compact table.bill .lbl { font-size: 7pt; }
  .billing-doc-compact table.bill .field-value { font-size: 8pt; }
  .billing-doc-compact table.bill .subhead { font-size: 6.5pt; margin-bottom: 0; }
  .billing-doc-compact table.bill .section-title { font-size: 7pt; padding-top: 2px; padding-bottom: 2px; }
  .billing-doc-compact table.bill .meter-no-value { font-size: 8pt; margin-top: 2px; }
  .billing-doc-compact table.bill .collection-value { font-size: 8pt; }
  .billing-doc-compact table.bill .date-value { font-size: 7.5pt; }
  .billing-doc-compact table.bill .col-head { font-size: 6.5pt; }
  .billing-doc-compact table.bill .amount-cell,
  .billing-doc-compact table.bill .reading-cell {
    font-size: 8pt;
    padding-top: 4px;
    padding-bottom: 4px;
  }
  .billing-doc-compact table.bill .total-cell { font-size: 8.5pt; }
  .billing-doc-compact .rate-cell {
    font-size: 7pt;
    line-height: 1.3;
    padding: 4px 6px !important;
  }
  .billing-doc-compact .rate-title {
    margin-bottom: 2px;
    padding-bottom: 2px;
  }
  .billing-doc-compact .note-cell { padding: 4px 6px !important; }
  .billing-doc-compact .note-line { font-size: 7.5pt; margin-bottom: 2px; }
  .billing-doc-compact .sig-block { padding-top: 10px; }
  .billing-doc-compact .sig-name {
    font-size: 8pt;
    min-width: 50%;
    margin-top: 10px;
    padding-top: 2px;
  }
  .billing-doc-compact .sig-title { font-size: 7pt; }

  @media print {
    .controls { display: none !important; }
    body { background: #fff; margin: 0; }
    #bill-wrap { padding: 0; gap: 0; }
    .bulk-page {
      border: none;
      box-shadow: none;
      margin: 0;
      page-break-after: always;
    }
    table.bill .section-title,
    table.bill .field-label,
    table.bill .meter-no-cell,
    table.bill .collection-cell,
    table.bill .col-head,
    table.bill .total-cell {
      background: #f3f3f3 !important;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    @page { size: A4; margin: 0; }
  }
</style>
</head>
<body>
<div class="controls">
  <span id="summaryLabel"></span>
  <span id="loadStatus"></span>
  <span class="spacer"></span>
  <button class="btn" id="btnPrint" disabled onclick="window.print()">Print</button>
</div>
<div id="loading" class="loading-box">Loading bulk waterworks billing statements&hellip;</div>
<div id="error" class="error-box" style="display:none"></div>
<div id="bill-wrap" class="hidden"></div>

<script src="/js/waterworks-billing-common.js"></script>
<script>
(function () {
  var p = new URLSearchParams(location.search);
  var IDS = (p.get('ids') || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
  var MONTH = parseInt(p.get('month'), 10) || (new Date().getMonth() + 1);
  var YEAR = parseInt(p.get('year'), 10) || new Date().getFullYear();
  var SUPPLY_ID = p.get('supply_id') || '';
  var STATUS = p.get('status') || '';
  var TOKEN = p.get('token') || localStorage.getItem('token') || '';
  var WW = window.WaterworksBillingCommon;
  var API = WW.resolveApiBase();

  function showError(msg) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('bill-wrap').classList.add('hidden');
    var el = document.getElementById('error');
    el.textContent = msg;
    el.style.display = 'block';
  }

  function setSummary(count) {
    document.getElementById('summaryLabel').textContent =
      count + ' statement' + (count === 1 ? '' : 's') +
      ' — ' + WW.MONTHS[MONTH - 1] + ' ' + YEAR +
      ' (2 per A4 page)';
  }

  function resolveAccountIds() {
    if (IDS.length) return Promise.resolve(IDS);
    return WW.fetchBillsList(API, TOKEN, {
      billing_month: MONTH,
      billing_year: YEAR,
      supply_id: SUPPLY_ID || undefined,
      status: STATUS || undefined,
      page: 1,
      limit: 500
    }).then(function (res) {
      var rows = res.data || [];
      return rows.map(function (b) { return b.account_id; }).filter(Boolean);
    });
  }

  function loadAll() {
    if (!TOKEN) {
      showError('Missing authentication token.');
      return;
    }

    document.getElementById('loading').style.display = 'block';
    document.getElementById('error').style.display = 'none';
    document.getElementById('bill-wrap').classList.add('hidden');
    document.getElementById('btnPrint').disabled = true;
    document.getElementById('loadStatus').textContent = 'Loading…';

    resolveAccountIds()
      .then(function (ids) {
        if (!ids.length) {
          throw new Error('No bills found for the selected period.');
        }
        document.getElementById('loadStatus').textContent = 'Loading ' + ids.length + ' statements…';
        return WW.fetchSettings(API, TOKEN).then(function (settings) {
          var promises = ids.map(function (id) {
            return WW.fetchBillingData(API, TOKEN, id, MONTH, YEAR).catch(function (err) {
              console.warn('Failed billing for account ' + id + ':', err.message);
              return null;
            });
          });
          return Promise.all(promises).then(function (results) {
            return {
              settings: settings,
              statements: results.filter(function (r) { return r && r.data && r.data.bill; })
            };
          });
        });
      })
      .then(function (result) {
        if (!result.statements.length) {
          throw new Error('Could not load billing data for any accounts in this period.');
        }
        document.getElementById('bill-wrap').innerHTML = WW.renderBulkPages(
          result.statements,
          result.settings,
          { billingMonth: MONTH, billingYear: YEAR }
        );
        document.getElementById('loading').style.display = 'none';
        document.getElementById('loadStatus').textContent = '';
        document.getElementById('bill-wrap').classList.remove('hidden');
        document.getElementById('btnPrint').disabled = false;
        setSummary(result.statements.length);
      })
      .catch(function (err) {
        showError(err.message || 'Failed to load bulk billing.');
        document.getElementById('loadStatus').textContent = '';
      });
  }

  loadAll();
})();
</script>
</body>
</html>
