<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Water Rate Computation</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, Helvetica, sans-serif; background: #f3f4f6; color: #111; }
  .controls {
    padding: 10px 16px; background: #f8f9fa; border-bottom: 1px solid #dee2e6;
    display: flex; align-items: center; gap: 8px; position: sticky; top: 0; z-index: 100;
  }
  .btn { padding: 7px 14px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; color: #fff; background: #1d4ed8; }
  .btn:disabled { background: #6c757d; cursor: not-allowed; }
  #loadStatus { font-size: 13px; color: #555; }
  #wrap { display: flex; justify-content: center; padding: 20px 12px 40px; }
  #wrap.hidden { display: none; }
  .doc {
    width: 8.5in; background: #fff; border: 1px solid #d1d5db;
    padding: 0.45in; font-size: 10pt; line-height: 1.4;
  }
  h1 { font-size: 14pt; text-align: center; color: #1e3a8a; }
  h2 { font-size: 11pt; margin: 16px 0 8px; border-bottom: 1px solid #cbd5e1; padding-bottom: 4px; }
  .sub { text-align: center; color: #64748b; font-size: 9pt; margin-bottom: 16px; }
  table { width: 100%; border-collapse: collapse; margin: 8px 0 12px; }
  th, td { border: 1px solid #cbd5e1; padding: 5px 7px; }
  th { background: #f1f5f9; text-align: left; font-size: 9pt; }
  td.num, th.num { text-align: right; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; margin: 8px 0; }
  .kv { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dotted #e2e8f0; padding: 3px 0; }
  .total { font-weight: bold; background: #eff6ff; }
  .opex-layout { display: grid; grid-template-columns: 1.1fr 1fr; gap: 16px; margin: 8px 0 12px; align-items: start; }
  .opex-line { display: flex; align-items: baseline; gap: 6px; margin: 4px 0; font-size: 9.5pt; }
  .opex-line .letter { width: 18px; color: #475569; }
  .opex-line .name { flex: 1; }
  .opex-line .box { min-width: 72px; border: 1px solid #94a3b8; background: #f1f5f9; padding: 2px 6px; text-align: right; }
  .staff-meta { margin: 6px 0 10px; font-size: 10pt; }
  .staff-meta .box { display: inline-block; min-width: 2.5rem; border: 1px solid #94a3b8; background: #e2e8f0; padding: 2px 8px; text-align: center; font-weight: bold; }
  @media print {
    .controls { display: none; }
    body { background: #fff; }
    #wrap { padding: 0; }
    .doc { border: none; width: 100%; }
    .opex-layout { grid-template-columns: 1.1fr 1fr; }
  }
  @media (max-width: 800px) {
    .opex-layout { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="controls">
  <span id="loadStatus">Loading...</span>
  <div style="flex:1"></div>
  <button class="btn" id="btnPrint" disabled onclick="window.print()">Print</button>
</div>
<div id="wrap" class="hidden"></div>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var supplyId = params.get('supply_id');
  var token = params.get('token') || localStorage.getItem('token');
  var api = window.location.origin.includes('6070')
    ? 'http://' + window.location.hostname + ':5040'
    : (window.location.origin.replace(':3000', ':5000'));

  function fmt(n) {
    return Number(n || 0).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function esc(s) {
    var d = document.createElement('div');
    d.appendChild(document.createTextNode(s == null ? '' : String(s)));
    return d.innerHTML;
  }

  if (!supplyId || !token) {
    document.getElementById('loadStatus').textContent = 'Missing supply_id or token';
    return;
  }

  fetch(api + '/api/waterworks/supplies/' + encodeURIComponent(supplyId) + '/rate-computation', {
    headers: { Authorization: 'Bearer ' + token }
  })
    .then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.error || 'Failed'); return d; }); })
    .then(function (res) {
      var data = res.data;
      var s = data.supply || {};
      var c = data.computation || {};
      var dmd = c.demand || {};
      var exp = c.expenses || {};
      var cls = c.classifications || {};
      var opex = (c.opex && c.opex.rows) || data.opex || [];
      var assets = (c.assets && c.assets.rows) || data.assets || [];
      var staff = (c.staff && c.staff.rows) || data.staff || [];
      var staffHeadcount = (c.staff && c.staff.total_headcount != null)
        ? c.staff.total_headcount
        : staff.reduce(function (s, r) { return s + (Number(r.headcount) || 0); }, 0);
      var staffDailyTotal = (c.staff && c.staff.total_daily != null)
        ? c.staff.total_daily
        : staff.reduce(function (s, r) { return s + (Number(r.headcount) || 0) * (Number(r.monthly_rate) || 0); }, 0);

      var letters = 'abcdefghijk';
      var opexLines = opex.map(function (r, i) {
        var letter = letters[i] || String(i + 1);
        var amount = Number(r.amount_monthly) || 0;
        var show = amount > 0 ? fmt(amount) : '';
        return '<div class="opex-line"><span class="letter">' + letter + '.</span>' +
          '<span class="name">' + esc(r.category_name) + '</span>' +
          '<span>= PhP</span><span class="box">' + show + '</span><span>/month</span></div>';
      }).join('');

      var staffRowsHtml = staff.map(function (r) {
        var no = Number(r.headcount) || 0;
        var rate = Number(r.monthly_rate) || 0;
        var total = no * rate;
        return '<tr><td>' + esc(r.role_name) + '</td>' +
          '<td class="num">' + (no ? no : '') + '</td>' +
          '<td class="num">' + (rate ? fmt(rate) : '') + '</td>' +
          '<td class="num">' + fmt(total) + '</td></tr>';
      }).join('');

      var sched = '';
      var resTiers = (cls.residential && cls.residential.tiers) || [];
      for (var i = 0; i < resTiers.length; i++) {
        var t = resTiers[i];
        var tap = (cls.tapstand && cls.tapstand.tiers[i]) || {};
        var com = (cls.commercial && cls.commercial.tiers[i]) || {};
        sched += '<tr><td>' + esc(t.label) + '</td><td class="num">₱ ' + fmt(tap.rate_per_m3 || tap.minimum_bill) +
          '</td><td class="num">₱ ' + fmt(t.rate_per_m3 || t.minimum_bill) +
          '</td><td class="num">₱ ' + fmt(com.rate_per_m3 || com.minimum_bill) + '</td></tr>';
      }

      document.getElementById('wrap').innerHTML =
        '<div class="doc">' +
        '<h1>WATER RATE COMPUTATION</h1>' +
        '<p class="sub">Full Cost Recovery — ' + esc(s.supply_name) + ' (' + esc(s.supply_code) + ')</p>' +
        '<h2>1.1 Projected Water Volume</h2>' +
        '<div class="grid">' +
          '<div class="kv"><span>Households</span><strong>' + esc(dmd.household_count) + '</strong></div>' +
          '<div class="kv"><span>Ave. HH size</span><strong>' + esc(dmd.avg_household_size) + '</strong></div>' +
          '<div class="kv"><span>L / person / day</span><strong>' + esc(dmd.liters_per_person_day) + '</strong></div>' +
          '<div class="kv"><span>Projected monthly m³</span><strong>' + fmt(dmd.projected_monthly_m3) + '</strong></div>' +
        '</div>' +
        '<h2>2 EXPENSES</h2>' +
        '<h2 style="border:none;margin-top:4px;">2.1 Operating Cost:</h2>' +
        '<div class="staff-meta">Number of Staff = <span class="box">' + esc(staffHeadcount) + '</span></div>' +
        '<div class="opex-layout">' +
          '<div>' + opexLines + '</div>' +
          '<div>' +
            '<p style="font-weight:bold;margin-bottom:6px;">Technical Staff:</p>' +
            '<table><thead><tr><th>Technical Staff</th><th class="num">No.</th><th class="num">Rate</th><th class="num">Total</th></tr></thead><tbody>' +
            staffRowsHtml +
            '<tr class="total"><td>Total</td><td class="num">' + esc(staffHeadcount) + '</td><td></td><td class="num">' + fmt(staffDailyTotal) + '</td></tr>' +
            '</tbody></table>' +
          '</div>' +
        '</div>' +
        '<p style="font-size:8pt;color:#64748b;margin-bottom:8px;">Honorarium = staff Total × days/month. Staff Rate is daily.</p>' +
        '<h2>2.2 Depreciation Cost</h2>' +
        '<table><thead><tr><th>#</th><th>System Components</th><th class="num">Cost Mat\'s &amp; Labor (PhP)</th><th class="num">Service Life* (yr)</th><th class="num">% of Cost to be depreciated</th><th class="num">Yearly</th><th class="num">Monthly</th></tr></thead><tbody>' +
        assets.map(function (r, i) {
          var hasCost = Number(r.cost || 0) > 0;
          return '<tr><td>' + (i + 1) + '</td><td>' + esc(r.component_name) + '</td><td class="num">' +
            (hasCost ? '₱ ' + fmt(r.cost) : '—') + '</td><td class="num">' +
            esc(r.service_life_years) + '</td><td class="num">' + esc(r.depreciable_percent) + '%</td><td class="num">' +
            (hasCost ? '₱ ' + fmt(r.depreciation_yearly) : '—') + '</td><td class="num">' +
            (hasCost ? '₱ ' + fmt(r.depreciation_monthly) : '—') + '</td></tr>';
        }).join('') +
        '<tr class="total"><td colspan="2">TOTAL</td><td class="num">₱ ' + fmt((c.assets && c.assets.total_cost) || 0) +
        '</td><td colspan="2"></td><td class="num">₱ ' + fmt((c.assets && c.assets.total_depreciation_yearly) || 0) +
        '</td><td class="num">₱ ' + fmt(exp.depreciation_cost) + '</td></tr>' +
        '</tbody></table>' +
        '<p style="font-size:8pt;color:#64748b;margin-bottom:8px;">* Economic / Usable Life</p>' +
        '<h2>2.3 Amortization Cost</h2>' +
        '<p style="font-size:9.5pt;margin:6px 0 10px;">NOTE: If grant, no need to compute. However, if loan, add monthly amortization amount to the &lsquo;Expense&rsquo;.</p>' +
        '<div class="kv" style="max-width:420px;"><span>Monthly Amortization</span><strong>PhP ' + fmt(exp.amortization_cost) + ' /month</strong></div>' +
        '<h2>2.4 Inflation Cost</h2>' +
        '<p style="font-size:9.5pt;margin:6px 0;">Inflation Cost = Inflation rate of the month × (Operating cost + Depreciation cost)</p>' +
        '<p style="font-size:9.5pt;margin:6px 0;">Inflation rate = <span class="box" style="display:inline-block;min-width:3rem;text-align:center;border:1px solid #94a3b8;background:#f1f5f9;padding:2px 8px;">' +
          esc(exp.inflation_rate_percent) + '%</span> <span style="color:#64748b;">(latest / highest monthly figure from NEDA)</span></p>' +
        '<div style="margin:10px 0 6px;font-size:9.5pt;">' +
          'Total Expenses = (PhP ' + fmt(exp.operating_cost) + ' + PhP ' + fmt(exp.depreciation_cost) + ') = <strong>PhP ' + fmt(exp.inflation_base) + '</strong>' +
        '</div>' +
        '<div style="margin:6px 0 14px;font-size:9.5pt;">' +
          'Inflation Cost = PhP ' + fmt(exp.inflation_base) + ' × ' + esc(exp.inflation_rate_percent) + '% = ' +
          '<strong style="display:inline-block;border:2px solid #111;padding:2px 10px;min-width:5rem;text-align:right;">PhP ' + fmt(exp.inflation_cost) + '</strong> / month' +
        '</div>' +
        '<h2>Summary of Expenses:</h2>' +
        '<table style="max-width:420px;"><tbody>' +
        '<tr><td>Operating Cost</td><td class="num">PhP ' + fmt(exp.operating_cost) + ' /month</td></tr>' +
        '<tr><td>Depreciation Cost</td><td class="num">PhP ' + fmt(exp.depreciation_cost) + ' /month</td></tr>' +
        '<tr><td>Inflation Cost</td><td class="num">PhP ' + fmt(exp.inflation_cost) + ' /month</td></tr>' +
        '<tr><td>Amortization Cost</td><td class="num">PhP ' + (Number(exp.amortization_cost) > 0 ? fmt(exp.amortization_cost) : '—') + ' /month</td></tr>' +
        '<tr class="total"><td>TOTAL</td><td class="num">PhP ' + fmt(exp.total) + ' /month</td></tr>' +
        '</tbody></table>' +
        '<p style="margin:12px 0;"><strong>Base Rate</strong> = Total Expenses ÷ Projected Volume = ' +
          '<strong>₱ ' + fmt(c.base_rate) + ' / Cu. M.</strong></p>' +
        '<h2>Water Rate Schedule</h2>' +
        '<table><thead><tr><th>Bracket</th><th class="num">Tapstand</th><th class="num">Residential</th><th class="num">Commercial</th></tr></thead><tbody>' +
        sched +
        '</tbody></table>' +
        '</div>';

      document.getElementById('wrap').classList.remove('hidden');
      document.getElementById('btnPrint').disabled = false;
      document.getElementById('loadStatus').textContent = 'Ready';
    })
    .catch(function (err) {
      document.getElementById('loadStatus').textContent = err.message || 'Error loading report';
    });
})();
</script>
</body>
</html>
