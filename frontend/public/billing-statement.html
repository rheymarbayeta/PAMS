<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Billing Statement</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, Helvetica, sans-serif; background: #f3f4f6; }

  /* ── Controls bar ── */
  .controls {
    padding: 10px 16px;
    background: #f8f9fa;
    border-bottom: 1px solid #dee2e6;
    display: flex;
    align-items: center;
    gap: 8px;
    position: sticky;
    top: 0;
    z-index: 100;
    flex-wrap: wrap;
  }
  .controls label { font-size: 13px; color: #555; }
  .controls select {
    padding: 5px 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 13px;
  }
  .btn {
    padding: 7px 14px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    color: #fff;
  }
  .btn-print  { background: #28a745; }
  .btn-print:hover  { background: #1e7e34; }
  .btn-reload { background: #6366f1; }
  .btn-reload:hover { background: #4f46e5; }
  .btn:disabled { background: #6c757d; cursor: not-allowed; }
  .spacer { flex: 1; }
  #loadStatus { font-size: 13px; color: #555; }

  /* ── Page wrapper ── */
  #bill-wrap {
    display: flex;
    justify-content: center;
    padding: 20px 12px 40px;
  }
  #bill-wrap.hidden { display: none; }

  /* ── Billing document: Letter size portrait ── */
  .billing-doc {
    width: 8.5in;
    min-height: 11in;
    background: #fff;
    border: 1px solid #d1d5db;
    padding: 0.5in;
    font-size: 11pt;
    color: #1f2937;
    line-height: 1.5;
    font-family: 'Calibri', 'Segoe UI', Arial, sans-serif;
  }

  /* Header row with property and billing number */
  .bill-header-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 2px;
    margin-top: 4px;
  }
  .bill-property { 
    flex: 1; 
    font-weight: 700;
    font-size: 12pt;
    color: #111;
  }
  .bill-statement-no { 
    text-align: right;
    font-weight: 600;
    font-size: 10pt;
    line-height: 1.4;
    color: #374151;
  }

  /* Location row */
  .bill-location {
    font-size: 10pt;
    margin-bottom: 2px;
    color: #555;
  }

  /* Billing period */
  .bill-period {
    text-align: right;
    font-size: 10pt;
    margin-bottom: 4px;
    font-weight: 600;
    color: #374151;
  }

  /* Top section with lessee and space no */
  .bill-lessee-section {
    display: flex;
    justify-content: space-between;
    margin-bottom: 4px;
    padding-bottom: 4px;
    border-bottom: 1px solid #e5e7eb;
  }
  .bill-lessee-section > div:first-child {
    font-weight: 700;
    font-size: 13pt;
    color: #111;
  }
  .bill-lessee-section > div:last-child {
    font-weight: 600;
    font-size: 11pt;
    color: #374151;
  }

  /* Total amount due box */
  .bill-total-box {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 4px;
    padding: 6px 10px;
    background: #f9fafb;
    border-left: 4px solid #1e40af;
  }
  .bill-total-label {
    font-weight: 700;
    font-size: 11pt;
    color: #1f2937;
    flex: 1;
  }
  .bill-total-value {
    border: 2px solid #1e40af;
    padding: 5px 10px;
    font-weight: 700;
    font-size: 14pt;
    color: #1e40af;
    min-width: 120px;
    text-align: right;
    background: #fff;
  }

  /* Payment due date */
  .bill-due-section {
    display: flex;
    gap: 12px;
    margin-bottom: 2px;
    font-size: 11pt;
  }
  .bill-due-label {
    font-weight: 700;
    color: #1f2937;
    min-width: 140px;
  }
  .bill-due-section > span:last-child {
    font-weight: 600;
    color: #374151;
  }

  /* Surcharge note */
  .bill-note {
    font-size: 10pt;
    font-style: italic;
    margin-bottom: 8px;
    color: #6b7280;
    margin-top: 0px;
  }

  /* Section title */
  .bill-section-title {
    text-align: center;
    font-weight: 700;
    font-size: 11pt;
    letter-spacing: 2px;
    margin: 14px 0 10px;
    color: #111;
    text-transform: uppercase;
  }

  /* Rental details table */
  .bill-rental-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 12px;
    font-size: 11pt;
    background: #fff;
  }
  .bill-rental-table td {
    border: 1px solid #d1d5db;
    padding: 6px 8px;
    vertical-align: middle;
  }
  .bill-rental-table tr:nth-child(odd) {
    background: #f9fafb;
  }
  .bill-rental-label {
    font-weight: 600;
    color: #1f2937;
    width: 65%;
  }
  .bill-rental-value {
    text-align: right;
    font-weight: 600;
    color: #1f2937;
    width: 35%;
  }

  /* Signatory section */
  .bill-signatory {
    text-align: right;
    margin: 24px 0 16px;
    font-size: 11pt;
  }
  .signatory-line { 
    border-top: 1px solid #333; 
    width: 150px; 
    margin: 45px 0 4px auto;
  }
  .signatory-name { 
    font-weight: 700; 
    margin-top: 2px;
    color: #111;
  }
  .signatory-title { 
    font-size: 10pt; 
    color: #6b7280;
    margin-top: 1px;
  }

  /* Footer */
  .bill-footer {
    text-align: center;
    font-size: 9pt;
    color: #9ca3af;
    margin-top: 16px;
    padding-top: 8px;
    border-top: 1px solid #e5e7eb;
    font-style: italic;
  }

  .error-box { margin: 20px; padding: 14px; background: #fee2e2; border: 1px solid #fca5a5; border-radius: 6px; color: #991b1b; font-size: 13px; }
  .loading-box { margin: 40px; text-align: center; font-size: 15px; color: #555; }

  /* Print */
  @media print {
    body { background: #fff; margin: 0; }
    .controls { display: none !important; }
    #bill-wrap { padding: 0; display: block; }
    .billing-doc { width: 8.5in; min-height: 11in; border: none; margin: 0; }
    @page { size: letter; margin: 0; }
  }
</style>
</head>
<body>

<div class="controls">
  <label>Month:</label>
  <select id="selMonth"></select>
  <label>Year:</label>
  <select id="selYear"></select>
  <button class="btn btn-reload" id="btnReload">&#8635; Refresh</button>
  <span id="loadStatus"></span>
  <span class="spacer"></span>
  <button class="btn btn-print" id="btnPrint" disabled onclick="window.print()">&#128424; Print</button>
</div>

<div id="loading" class="loading-box">Loading billing statement&hellip;</div>
<div id="error"  class="error-box" style="display:none"></div>
<div id="bill-wrap" class="hidden"></div>

<script>
var MONTHS = ['January','February','March','April','May','June',
              'July','August','September','October','November','December'];

var p     = new URLSearchParams(location.search);
var ID    = p.get('id')    || '';
var TOKEN = p.get('token') || localStorage.getItem('token') || '';
var API   = location.origin;

// Global state for header/footer
var headerSettings = {};
var currentUserName = 'System';
var treasurerName = 'Municipal Treasurer';
var treasurerPosition = 'Municipal Treasurer';
var settingsReady = false;

/* Fetch settings and user info */
Promise.all([
  fetch(API + '/api/settings', { headers: { 'Authorization': 'Bearer ' + TOKEN } }).then(r => r.ok ? r.json() : {}),
  fetch(API + '/api/auth/me', { headers: { 'Authorization': 'Bearer ' + TOKEN } }).then(r => r.ok ? r.json() : {})
])
.then(function(results) {
  var settings = results[0];
  var userInfo = results[1];
  
  // Extract header settings
  var getLogoUrl = function(url) {
    if (!url) return null;
    if (url.startsWith('http')) return url;
    if (url.startsWith('/api/')) return API + url;
    return url;
  };
  
  headerSettings = {
    logoLeftUrl: getLogoUrl(settings.assessment_header_logo_left?.value),
    logoRightUrl: getLogoUrl(settings.assessment_header_logo_right?.value),
    logoHeight: Math.max(20, Math.min(120, parseFloat(settings.assessment_header_logo_size?.value) || 40)),
    line1: settings.assessment_header_line_1?.value || 'REPUBLIC OF THE PHILIPPINES',
    line2: settings.assessment_header_line_2?.value || 'MUNICIPALITY OF DALAGUETE',
    line3: settings.assessment_header_line_3?.value || 'PROVINCE OF CEBU',
    line4: settings.assessment_header_line_4?.value || 'MUNICIPAL TREASURER\'S OFFICE',
    line5: settings.assessment_header_line_5?.value || '',
    fontSize: Math.max(7, Math.min(20, parseFloat(settings.assessment_header_font_size?.value) || 9))
  };
  
  if (userInfo.name) currentUserName = userInfo.name;
  if (settings.municipal_treasurer_name?.value) treasurerName = settings.municipal_treasurer_name.value;
  if (settings.municipal_treasurer_position?.value) treasurerPosition = settings.municipal_treasurer_position.value;
  
  settingsReady = true;
  // Auto-load billing after settings are ready
  loadBilling();
})
.catch(function(err) {
  console.warn('Failed to fetch settings/user info:', err);
  settingsReady = true;
  loadBilling();
});

/* Populate selects */
var now = new Date();
var selMonth = document.getElementById('selMonth');
var selYear  = document.getElementById('selYear');

MONTHS.forEach(function(m, i) {
  var o = document.createElement('option');
  o.value = i + 1;
  o.textContent = m;
  if (i + 1 === (now.getMonth() + 1)) o.selected = true;
  selMonth.appendChild(o);
});
for (var y = now.getFullYear() - 3; y <= now.getFullYear() + 6; y++) {
  var o2 = document.createElement('option');
  o2.value = y;
  o2.textContent = y;
  if (y === now.getFullYear()) o2.selected = true;
  selYear.appendChild(o2);
}

// Override with URL params if present
if (p.get('month')) selMonth.value = p.get('month');
if (p.get('year'))  selYear.value  = p.get('year');

document.getElementById('btnReload').addEventListener('click', loadBilling);

function fmt(n) {
  return Number(n).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtDate(d) {
  if (!d) return '—';
  return new Date(d).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
}
function periodLabel(m, y) {
  var lastDay = new Date(y, m, 0).getDate();
  return MONTHS[m - 1] + ' 1-' + lastDay + ', ' + y;
}
function dueDateLabel(d) {
  if (!d) return '—';
  var date = new Date(d);
  var month = MONTHS[date.getMonth()].substring(0, 3) + '.';
  var day = String(date.getDate()).padStart(2, '0');
  var year = date.getFullYear();
  return month + ' ' + day + ', ' + year;
}

function showError(msg) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('bill-wrap').classList.add('hidden');
  var el = document.getElementById('error');
  el.textContent = msg;
  el.style.display = 'block';
}

function loadBilling() {
  var month = selMonth.value;
  var year  = selYear.value;

  document.getElementById('loading').style.display = 'block';
  document.getElementById('error').style.display   = 'none';
  document.getElementById('bill-wrap').classList.add('hidden');
  document.getElementById('btnPrint').disabled = true;
  document.getElementById('loadStatus').textContent = 'Loading…';

  fetch(API + '/api/rights-and-rentals/lease-contracts/' + ID + '/billing?month=' + month + '&year=' + year, {
    headers: { 'Authorization': 'Bearer ' + TOKEN }
  })
  .then(function(r) {
    if (!r.ok) return r.json().then(function(e) { throw new Error(e.error || 'Error ' + r.status); });
    return r.json();
  })
  .then(function(data) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('loadStatus').textContent = '';
    renderBill(data);
    document.getElementById('bill-wrap').classList.remove('hidden');
    document.getElementById('btnPrint').disabled = false;
  })
  .catch(function(err) {
    showError('Failed to load billing data: ' + err.message);
    document.getElementById('loadStatus').textContent = '';
  });
}

function renderBill(data) {
  var c = data.contract;
  var b = data.billing;
  var rn = b.rental;

  var prevMonthIdx = b.billing_month === 1 ? 11 : b.billing_month - 2;
  var prevYear     = b.billing_month === 1 ? b.billing_year - 1 : b.billing_year;

  var unit = (c.property_units && c.property_units.length > 0) ? c.property_units[0] : null;
  var unitNo = unit ? (unit.stall_number || 'N/A') : 'N/A';

  // Build dynamic header
  var headerHtml = '<div style="text-align: center; margin-bottom: 6px; display: flex; justify-content: center; align-items: center; gap: 12px;">';
  if (headerSettings.logoLeftUrl) {
    headerHtml += '<img src="' + headerSettings.logoLeftUrl + '" alt="Logo" style="height: ' + headerSettings.logoHeight + 'px; width: auto; object-fit: contain;">';
  }
  headerHtml += '<div style="text-align: center;">';
  if (headerSettings.line1) headerHtml += '<div style="font-size:' + headerSettings.fontSize + 'pt; font-weight: bold;">' + esc(headerSettings.line1) + '</div>';
  if (headerSettings.line2) headerHtml += '<div style="font-size:' + headerSettings.fontSize + 'pt; font-weight: bold;">' + esc(headerSettings.line2) + '</div>';
  if (headerSettings.line3) headerHtml += '<div style="font-size:' + headerSettings.fontSize + 'pt; font-weight: bold;">' + esc(headerSettings.line3) + '</div>';
  if (headerSettings.line4) headerHtml += '<div style="font-size:' + Math.round(headerSettings.fontSize * 1.35) + 'pt; font-weight: bold; margin-top: 2px;">' + esc(headerSettings.line4) + '</div>';
  if (headerSettings.line5) headerHtml += '<div style="font-size:' + headerSettings.fontSize + 'pt; font-weight: bold; margin-top: 2px;">' + esc(headerSettings.line5) + '</div>';
  headerHtml += '</div>';
  if (headerSettings.logoRightUrl) {
    headerHtml += '<img src="' + headerSettings.logoRightUrl + '" alt="Logo 2" style="height: ' + headerSettings.logoHeight + 'px; width: auto; object-fit: contain;">';
  }
  headerHtml += '</div>';

  var wrap = document.getElementById('bill-wrap');
  
  var html = '<div class="billing-doc">'
    + headerHtml
    + '<hr style="border: none; border-top: 1px solid #333; margin: 4px 0;">'

    // Header row
    + '<div class="bill-header-row">'
    + '<div class="bill-property">' + esc(c.property_name.toUpperCase()) + '</div>'
    + '<div class="bill-statement-no">BILLING STATEMENT No.<br>' + esc(b.billing_number) + '</div>'
    + '</div>'

    // Location
    + '<div class="bill-location">' + esc(c.property_address || 'Dalaguete, Cebu') + '</div>'

    // Billing period
    + '<div class="bill-period">As of ' + periodLabel(b.billing_month, b.billing_year) + '</div>'

    // Lessee and space number
    + '<div class="bill-lessee-section">'
    + '<div>' + esc(c.lessee_name.toUpperCase()) + '</div>'
    + '<div>SPACE No: ' + esc(unitNo) + '</div>'
    + '</div>'

    // Total amount due box
    + '<div class="bill-total-box">'
    + '<span class="bill-total-label">TOTAL AMOUNT DUE:</span>'
    + '<span class="bill-total-value">₱ ' + fmt(b.total_due) + '</span>'
    + '</div>'

    // Payment due date
    + '<div class="bill-due-section">'
    + '<span class="bill-due-label">PAYMENT DUE DATE:</span>'
    + '<span>' + dueDateLabel(b.payment_due_date) + '</span>'
    + '</div>'

    // Note about surcharge
    + '<div class="bill-note">Note: 20% surcharge for late payments.</div>'

    // Section title
    + '<div class="bill-section-title">M O N T H L Y &nbsp;&nbsp;R E N T A L S</div>'

    // Rental details table
    + '<table class="bill-rental-table">'
    + '<tr><td class="bill-rental-label">BALANCE (' + MONTHS[prevMonthIdx].toUpperCase() + ' ' + prevYear + '):</td><td class="bill-rental-value">₱ ' + fmt(rn.previous_balance) + '</td></tr>'
    + '<tr><td class="bill-rental-label">Surcharge (20%)</td><td class="bill-rental-value">₱ ' + fmt(rn.surcharge) + '</td></tr>'
    + '<tr><td class="bill-rental-label">This Month (' + MONTHS[b.billing_month - 1].toUpperCase() + ' ' + b.billing_year + '):</td><td class="bill-rental-value">₱ ' + fmt(rn.this_month) + '</td></tr>'
    + '<tr><td class="bill-rental-label"><div style="margin-left: 16px;">Less: Late Payment</div></td><td class="bill-rental-value"></td></tr>';
  
  if (rn.late_payment_or) {
    html += '<tr><td class="bill-rental-label"><div style="margin-left: 32px;">with OR#' + esc(rn.late_payment_or) + '</div></td><td class="bill-rental-value">₱ ' + fmt(rn.late_payment_amount) + '</td></tr>';
  }
  
  html += '<tr><td class="bill-rental-label">Monthly Rental:</td><td class="bill-rental-value">₱ ' + fmt(rn.monthly_rental) + '</td></tr>'
    + '<tr><td class="bill-rental-label"><strong>Dues (' + MONTHS[b.billing_month - 1].toUpperCase() + ' ' + b.billing_year + '):</strong></td><td class="bill-rental-value"><strong>₱ ' + fmt(rn.dues) + '</strong></td></tr>'
    + '</table>'

    // Signatory
    + '<div class="bill-signatory">'
    + '<div class="signatory-line"></div>'
    + '<div class="signatory-name">' + esc(treasurerName) + '</div>'
    + '<div class="signatory-title">' + esc(treasurerPosition) + '</div>'
    + '</div>'

    // Footer
    + '<div class="bill-footer">'
    + '** This is an electronically generated statement of account.'
    + '</div>'

    + '</div>';

  wrap.innerHTML = html;
}

function esc(str) {
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(str || ''));
  return d.innerHTML;
}
</script>
</body>
</html>
