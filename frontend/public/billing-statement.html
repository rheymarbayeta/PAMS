<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Billing Statement</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, Helvetica, sans-serif; background: #f3f4f6; }

  /* ── Controls bar ── */
  .controls {
    padding: 10px 16px;
    background: #f8f9fa;
    border-bottom: 1px solid #dee2e6;
    display: flex;
    align-items: center;
    gap: 8px;
    position: sticky;
    top: 0;
    z-index: 100;
    flex-wrap: wrap;
  }
  .controls label { font-size: 13px; color: #555; }
  .controls select {
    padding: 5px 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 13px;
  }
  .btn {
    padding: 7px 14px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    color: #fff;
  }
  .btn-print  { background: #28a745; }
  .btn-print:hover  { background: #1e7e34; }
  .btn-reload { background: #6366f1; }
  .btn-reload:hover { background: #4f46e5; }
  .btn:disabled { background: #6c757d; cursor: not-allowed; }
  .spacer { flex: 1; }
  #loadStatus { font-size: 13px; color: #555; }

  /* ── Page wrapper ── */
  #bill-wrap {
    display: flex;
    justify-content: center;
    padding: 20px 12px 40px;
  }
  #bill-wrap.hidden { display: none; }

  /* ── Billing document: Letter size portrait ── */
  .billing-doc {
    width: 8.5in;
    min-height: 11in;
    background: #fff;
    border: 1px solid #d1d5db;
    padding: 0.5in;
    font-size: 11pt;
    color: #1f2937;
    line-height: 1.5;
    font-family: 'Calibri', 'Segoe UI', Arial, sans-serif;
  }

  /* Header row with property and billing number */
  .bill-header-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 2px;
    margin-top: 4px;
  }
  .bill-property { 
    flex: 1; 
    font-weight: 700;
    font-size: 12pt;
    color: #111;
  }
  .bill-statement-no { 
    text-align: right;
    font-weight: 600;
    font-size: 10pt;
    line-height: 1.4;
    color: #374151;
  }

  /* Location row */
  .bill-location {
    font-size: 10pt;
    margin-bottom: 2px;
    color: #555;
  }

  /* Billing period */
  .bill-period {
    text-align: right;
    font-size: 10pt;
    margin-bottom: 4px;
    font-weight: 600;
    color: #374151;
  }

  /* Top section with lessee and space no */
  .bill-lessee-section {
    display: flex;
    justify-content: space-between;
    margin-bottom: 4px;
    padding-bottom: 4px;
    border-bottom: 1px solid #e5e7eb;
  }
  .bill-lessee-section > div:first-child {
    font-weight: 700;
    font-size: 13pt;
    color: #111;
  }
  .bill-lessee-section > div:last-child {
    font-weight: 600;
    font-size: 11pt;
    color: #374151;
  }

  /* Total amount due box */
  .bill-total-box {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 4px;
    padding: 6px 10px;
    background: #f9fafb;
    border-left: 4px solid #1e40af;
  }
  .bill-total-label {
    font-weight: 700;
    font-size: 11pt;
    color: #1f2937;
    flex: 1;
  }
  .bill-total-value {
    border: 2px solid #1e40af;
    padding: 5px 10px;
    font-weight: 700;
    font-size: 14pt;
    color: #1e40af;
    min-width: 120px;
    text-align: right;
    background: #fff;
  }

  /* Payment due date */
  .bill-due-section {
    display: flex;
    gap: 12px;
    margin-bottom: 2px;
    font-size: 11pt;
  }
  .bill-due-label {
    font-weight: 700;
    color: #1f2937;
    min-width: 140px;
  }
  .bill-due-section > span:last-child {
    font-weight: 600;
    color: #374151;
  }

  /* Surcharge note */
  .bill-note {
    font-size: 10pt;
    font-style: italic;
    margin-bottom: 8px;
    color: #6b7280;
    margin-top: 0px;
  }

  /* Section title */
  .bill-section-title {
    text-align: center;
    font-weight: 700;
    font-size: 11pt;
    letter-spacing: 2px;
    margin: 14px 0 10px;
    color: #111;
    text-transform: uppercase;
  }

  /* Combined RIGHTS / RENTAL table */
  .bill-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 12px;
    font-size: 10pt;
    background: #fff;
  }
  .bill-table th,
  .bill-table td {
    border: 1px solid #555;
    padding: 5px 6px;
    vertical-align: top;
  }
  .bill-table .section-head {
    background: #1e3a8a;
    color: #fff;
    text-align: center;
    font-size: 10pt;
    font-weight: bold;
    padding: 4px 6px;
  }
  .bill-table thead tr:last-child th {
    background: #dbeafe;
    color: #1e3a8a;
    font-weight: bold;
    text-align: center;
    font-size: 8.5pt;
  }
  .bill-table .num { text-align: right; font-weight: 600; }
  .bill-table .monthly-label,
  .bill-table .dues-label {
    font-size: 9pt;
    padding-left: 6px;
    font-weight: 600;
  }
  .bill-table .dues-label { font-style: italic; }
  .bill-table .dues-amount { font-weight: bold; }
  .bill-table .rental-col { border-left: 2px solid #555; }
  .bill-table .rental-line {
    display: flex;
    justify-content: space-between;
    gap: 6px;
    font-weight: 600;
  }
  .bill-table .or-line { font-size: 9pt; color: #555; font-weight: 500; }
  .bill-table .monthly-rental-line {
    border-top: 1px solid #aaa;
    padding-top: 2px;
  }
  .bill-table .or-section-head {
    background: #eff6ff;
    color: #1e3a8a;
    text-align: center;
    font-weight: bold;
    font-size: 9pt;
    padding: 4px 6px;
  }
  .bill-table .or-amount {
    font-weight: bold;
    color: #1e3a8a;
  }

  /* Rental details table (legacy) */
  .bill-rental-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 12px;
    font-size: 11pt;
    background: #fff;
  }
  .bill-rental-table td {
    border: 1px solid #d1d5db;
    padding: 6px 8px;
    vertical-align: middle;
  }
  .bill-rental-table tr:nth-child(odd) {
    background: #f9fafb;
  }
  .bill-rental-label {
    font-weight: 600;
    color: #1f2937;
    width: 65%;
  }
  .bill-rental-value {
    text-align: right;
    font-weight: 600;
    color: #1f2937;
    width: 35%;
  }

  /* Signatory section */
  .bill-signatory {
    text-align: right;
    margin: 24px 0 16px;
    font-size: 11pt;
  }
  .signatory-line { 
    border-top: 1px solid #333; 
    width: 150px; 
    margin: 45px 0 4px auto;
  }
  .signatory-name { 
    font-weight: 700; 
    margin-top: 2px;
    color: #111;
  }
  .signatory-title { 
    font-size: 10pt; 
    color: #6b7280;
    margin-top: 1px;
  }

  /* Footer */
  .bill-footer {
    text-align: center;
    font-size: 9pt;
    color: #9ca3af;
    margin-top: 16px;
    padding-top: 8px;
    border-top: 1px solid #e5e7eb;
    font-style: italic;
  }

  .error-box { margin: 20px; padding: 14px; background: #fee2e2; border: 1px solid #fca5a5; border-radius: 6px; color: #991b1b; font-size: 13px; }
  .loading-box { margin: 40px; text-align: center; font-size: 15px; color: #555; }

  /* Print */
  @media print {
    body { background: #fff; margin: 0; }
    .controls { display: none !important; }
    #bill-wrap { padding: 0; display: block; }
    .billing-doc { width: 8.5in; min-height: 11in; border: none; margin: 0; }
    @page { size: letter; margin: 0; }
  }
</style>
</head>
<body>

<div class="controls">
  <label>Month:</label>
  <select id="selMonth"></select>
  <label>Year:</label>
  <select id="selYear"></select>
  <button class="btn btn-reload" id="btnReload">&#8635; Refresh</button>
  <span id="loadStatus"></span>
  <span class="spacer"></span>
  <button class="btn btn-print" id="btnPrint" disabled onclick="window.print()">&#128424; Print</button>
</div>

<div id="loading" class="loading-box">Loading billing statement&hellip;</div>
<div id="error"  class="error-box" style="display:none"></div>
<div id="bill-wrap" class="hidden"></div>

<script src="/js/billing-common.js"></script>
<script>
var BC = window.BillingCommon;
var p = new URLSearchParams(location.search);
var ID = p.get('id') || '';
var TOKEN = p.get('token') || localStorage.getItem('token') || '';
var API = location.origin;
var billingCtx = null;

/* Populate selects */
var now = new Date();
var selMonth = document.getElementById('selMonth');
var selYear  = document.getElementById('selYear');

BC.MONTHS.forEach(function(m, i) {
  var o = document.createElement('option');
  o.value = i + 1;
  o.textContent = m;
  if (i + 1 === (now.getMonth() + 1)) o.selected = true;
  selMonth.appendChild(o);
});
for (var y = now.getFullYear() - 3; y <= now.getFullYear() + 6; y++) {
  var o2 = document.createElement('option');
  o2.value = y;
  o2.textContent = y;
  if (y === now.getFullYear()) o2.selected = true;
  selYear.appendChild(o2);
}

if (p.get('month')) selMonth.value = p.get('month');
if (p.get('year'))  selYear.value  = p.get('year');

document.getElementById('btnReload').addEventListener('click', loadBilling);

function showError(msg) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('bill-wrap').classList.add('hidden');
  var el = document.getElementById('error');
  el.textContent = msg;
  el.style.display = 'block';
}

function loadBilling() {
  var month = selMonth.value;
  var year  = selYear.value;

  document.getElementById('loading').style.display = 'block';
  document.getElementById('error').style.display   = 'none';
  document.getElementById('bill-wrap').classList.add('hidden');
  document.getElementById('btnPrint').disabled = true;
  document.getElementById('loadStatus').textContent = 'Loading…';

  var ctxPromise = billingCtx
    ? Promise.resolve(billingCtx)
    : BC.loadBillingContext(API, TOKEN).then(function(ctx) {
        billingCtx = ctx;
        return ctx;
      });

  ctxPromise
    .then(function(ctx) {
      return BC.fetchBillingData(API, TOKEN, ID, month, year).then(function(data) {
        return { ctx: ctx, data: data };
      });
    })
    .then(function(result) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('loadStatus').textContent = '';
      document.getElementById('bill-wrap').innerHTML = BC.renderBillingStatement(result.data, result.ctx);
      document.getElementById('bill-wrap').classList.remove('hidden');
      document.getElementById('btnPrint').disabled = false;
    })
    .catch(function(err) {
      showError('Failed to load billing data: ' + err.message);
      document.getElementById('loadStatus').textContent = '';
    });
}

loadBilling();
</script>
</body>
</html>
