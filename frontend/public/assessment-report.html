<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
<meta charset="utf-8"/>
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap');
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    margin: 0;
    padding: 0;
    background-color: #f5f5f5;
    font-family: 'Cambria', 'Noto Serif', 'Georgia', serif;
    font-size: 14px;
  }
  #report-container {
    max-width: 8.5in;
    margin: 20px auto;
    background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .loading {
    padding: 40px;
    text-align: center;
    font-size: 18px;
    color: #666;
  }
  .error {
    padding: 20px;
    background-color: #fff3cd;
    border: 1px solid #ffc107;
    border-radius: 4px;
    color: #856404;
    margin: 20px;
  }
  .controls {
    padding: 15px;
    background-color: #f8f9fa;
    border-bottom: 1px solid #dee2e6;
    text-align: right;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .btn {
    padding: 8px 16px;
    margin-left: 5px;
    background-color: #007bff;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
  }
  .btn:hover {
    background-color: #0056b3;
  }
  .btn:disabled {
    background-color: #6c757d;
    cursor: not-allowed;
  }
  .btn-print {
    background-color: #28a745;
  }
  .btn-print:hover {
    background-color: #1e7e34;
  }
  .btn-edit {
    background-color: #fd7e14;
  }
  .btn-edit:hover {
    background-color: #e56a00;
  }
  .btn-save {
    background-color: #28a745;
  }
  .btn-save:hover {
    background-color: #1e7e34;
  }
  .btn-cancel {
    background-color: #6c757d;
  }
  .btn-cancel:hover {
    background-color: #5a6268;
  }
  .btn-revert {
    background-color: #dc3545;
  }
  .btn-revert:hover {
    background-color: #c82333;
  }

  /* Report PDF Button */
  .report-pdf-btn {
    padding: 8px 16px;
    margin-left: 5px;
    background-color: #6366f1;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
  }
  
  .report-pdf-btn:hover:not(:disabled) {
    background-color: #4f46e5;
  }
  
  .report-pdf-btn:disabled {
    background-color: #ccc;
    cursor: not-allowed;
  }

  /* Page container for proper sizing — fixed height so footer is always at the bottom */
  .page {
    width: 8.5in;
    height: 13in;
    padding: 0.5in;
    padding-bottom: 0.75in; /* leave room for footer */
    margin: 0 auto 20px auto;
    background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    position: relative;
    page-break-after: always;
    box-sizing: border-box;
    overflow: hidden;
  }

  .page:last-child {
    page-break-after: avoid;
  }

  .page-content {
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  .page-footer {
    position: absolute;
    bottom: 0.35in;
    left: 0.5in;
    right: 0.5in;
    padding-top: 6px;
    border-top: 1px solid #ccc;
    text-align: center;
    font-size: 8px;
    color: #666;
  }

  .hidden {
    display: none;
  }

  /* Page break utilities */
  .page-break-before {
    page-break-before: always;
  }

  .page-break-after {
    page-break-after: always;
  }

  .avoid-break {
    page-break-inside: avoid;
  }

  /* Continuation header for multi-page */
  .continuation-header {
    text-align: center;
    margin-bottom: 20px;
    padding-bottom: 10px;
    border-bottom: 1px solid #ccc;
  }

  .continuation-header h3 {
    font-size: 14px;
    color: #666;
  }

  .editable-field {
    position: relative;
  }
  .editable-field.edit-mode {
    border: 1px dashed #007bff;
    padding: 5px;
    border-radius: 3px;
  }
  .edit-mode-indicator {
    display: none;
    background-color: #fff3cd;
    padding: 10px;
    margin-bottom: 15px;
    border: 1px solid #ffc107;
    border-radius: 4px;
    border-left: 4px solid #ffc107;
  }
  .edit-mode-indicator.active {
    display: block;
  }
  .edit-toolbar {
    margin-top: 5px;
    font-size: 12px;
    color: #666;
  }
  .ql-toolbar {
    border: 1px solid #ddd;
    border-top: none;
  }
  .ql-container {
    border: 1px solid #ddd;
    font-family: Arial, sans-serif;
    font-size: 12px;
  }
  input.text-edit-input {
    width: 100%;
    padding: 5px;
    border: 1px solid #007bff;
    border-radius: 3px;
    font-family: Arial, sans-serif;
    font-size: 12px;
  }
  
  /* Report PDF Button */
  .report-pdf-btn {
    padding: 8px 16px;
    margin-left: 5px;
    background-color: #6366f1;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
  }
  
  .report-pdf-btn:hover:not(:disabled) {
    background-color: #4f46e5;
  }
  
  .report-pdf-btn:disabled {
    background-color: #ccc;
    cursor: not-allowed;
  }
  
  .report-error {
    padding: 12px;
    background-color: #fee;
    border: 1px solid #fcc;
    border-radius: 4px;
    color: #c33;
    margin: 10px 15px;
    font-size: 13px;
    display: none;
  }
  
  .report-error.show {
    display: block;
  }

  @page {
    size: 8.5in 13in portrait;
    margin: 0;
  }

  @media print {
    body {
      background: white;
      margin: 0;
      padding: 0;
    }
    #report-container {
      box-shadow: none;
      margin: 0;
      max-width: 100%;
    }
    .controls {
      display: none !important;
    }
    .page {
      box-shadow: none;
      margin: 0;
      width: 8.5in;
      height: 13in;
      page-break-after: always;
      overflow: hidden;
    }
    .page:last-child {
      page-break-after: avoid;
    }
    .edit-mode-indicator {
      display: none !important;
    }
    .ql-toolbar {
      display: none !important;
    }
    .text-edit-input {
      display: none !important;
    }
    .edit-toolbar {
      display: none !important;
    }
    .editable-field.edit-mode {
      border: none;
      padding: 0;
    }
  }
</style>
<title>Generated Assessment Report</title>
</head>
<body>
<div id="report-container">
  <div class="controls">
    <button class="btn btn-print" onclick="printReport()">🖨️ Print</button>
    <button class="report-pdf-btn" id="reportPdfBtn" onclick="generateReportPDF()">📊 Generate Assessment Report (PDF)</button>
    <div id="reportError" class="report-error"></div>
    
    <button class="btn btn-edit" id="editBtn" onclick="toggleEditMode()" style="display:none;">Edit Report</button>
    <button class="btn btn-save" id="saveBtn" onclick="saveCustomization()" style="display:none;">Save Changes</button>
    <button class="btn btn-cancel" id="cancelBtn" onclick="toggleEditMode()" style="display:none;">Cancel</button>
    <button class="btn btn-revert" id="revertBtn" onclick="revertToOriginal()" style="display:none;" title="Revert to original generated content">Revert</button>
  </div>

  <div id="editModeIndicator" class="edit-mode-indicator">
    <strong>Edit Mode Active:</strong> You can now edit the report content. Click <strong>Save Changes</strong> to persist or <strong>Cancel</strong> to discard.
  </div>

  <div id="loading" class="loading">
    <p>Loading assessment report...</p>
  </div>

  <div id="error" class="error hidden"></div>

  <div id="report-content" class="hidden"></div>
</div>

<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<script src="js/modal-dialog.js"></script>
<script src="/js/report-pagination-common.js"></script>
<script>
// Get application ID from URL parameters
const urlParams = new URLSearchParams(window.location.search);
const applicationId = urlParams.get('id') || urlParams.get('applicationId');
const authToken = urlParams.get('token') || localStorage.getItem('token') || '';

// State management
let editMode = false;
let userCanEdit = false;
let currentReportType = 'assessment';
let customizationData = null;
let quillEditors = {};
let originalContent = {};
let currentContent = {};
let userRole = null;

// Determine API base URL
const apiBaseUrl = window.location.origin;

console.log('App ID:', applicationId);
console.log('API Base URL:', apiBaseUrl);
console.log('Auth Token:', authToken ? 'Present' : 'Missing');

document.addEventListener('DOMContentLoaded', function() {
  if (!applicationId) {
    showError('No application ID provided. Please pass ?id=<applicationId> in the URL.');
    return;
  }

  // Extract user info from token
  extractUserFromToken();

  fetchAssessmentReport();
  loadCustomization();
});

function extractUserFromToken() {
  try {
    if (!authToken) {
      console.warn('No auth token provided');
      return;
    }
    const parts = authToken.split('.');
    if (parts.length !== 3) {
      console.warn('Invalid token format (expected 3 parts, got ' + parts.length + ')');
      return;
    }
    const decoded = JSON.parse(atob(parts[1]));

    console.log('🔍 All fields in decoded token:', Object.keys(decoded));
    console.log('Full decoded token:', decoded);

    // Try different role field names
    userRole = decoded.role_name || decoded.role || decoded.roleId || decoded.role_id || 'Unknown';

    console.log('✅ Token decoded successfully, extracted value:', userRole);

    // Since token has roleId instead of role_name, fetch user data from backend
    if (decoded.userId && !decoded.role_name) {
      console.log('Token has userId but no role_name, fetching user data from backend...');
      fetchUserDataFromBackend(decoded.userId);
    } else {
      checkEditPermissions();
    }
  } catch (error) {
    console.error('❌ Error extracting user from token:', error);
    console.error('Token sample (first 50 chars):', authToken?.substring(0, 50));
  }
}

async function fetchUserDataFromBackend(userId) {
  try {
    const response = await fetch(`${apiBaseUrl}/api/users/${userId}`, {
      headers: {
        'Authorization': `Bearer ${authToken}`
      }
    });

    if (response.ok) {
      const userData = await response.json();
      console.log('✅ User data fetched:', userData);
      userRole = userData.role_name || userData.role || 'Unknown';
      console.log('✅ Role from backend:', userRole);
      checkEditPermissions();
    } else {
      console.warn('Failed to fetch user data, allowing edit attempt');
      // If fetch fails, allow the user to try editing - backend will enforce permissions
      userRole = 'Authenticated';
      checkEditPermissions();
    }
  } catch (error) {
    console.error('Error fetching user data:', error);
    // If fetch fails, allow the user to try editing - backend will enforce permissions
    userRole = 'Authenticated';
    checkEditPermissions();
  }
}

function checkEditPermissions() {
  const allowedRoles = ['Admin', 'SuperAdmin', 'Approver', 'Assessor'];
  userCanEdit = allowedRoles.includes(userRole) || userRole === 'Authenticated';

  console.log('=== EDIT PERMISSIONS DEBUG ===');
  console.log('User Role:', userRole);
  console.log('Allowed Roles:', allowedRoles);
  console.log('User Can Edit:', userCanEdit);
  console.log('Auth Token Present:', authToken ? 'Yes' : 'No');
  console.log('=============================');

  const editBtn = document.getElementById('editBtn');
  if (editBtn) {
    if (userCanEdit) {
      editBtn.style.display = 'inline-block';
      console.log('✅ Edit button shown');
    } else {
      console.log('❌ Edit button hidden - role "' + userRole + '" not in allowed list');
    }
  } else {
    console.log('❌ Edit button element not found in DOM');
  }
}

async function loadCustomization() {
  try {
    const response = await fetch(
      `${apiBaseUrl}/api/applications/${applicationId}/report-customization/${currentReportType}`,
      {
        method: 'GET',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${authToken}`
        },
        credentials: 'include'
      }
    );

    if (response.ok) {
      const data = await response.json();
      if (data.customization) {
        customizationData = data.customization;
        console.log('Loaded customization:', customizationData);
      }
    }
  } catch (error) {
    console.warn('Could not load report customization:', error);
  }
}

async function fetchAssessmentReport() {
  try {
    const applicationUrl = `${apiBaseUrl}/api/applications/${applicationId}`;
    const assessmentUrl = `${apiBaseUrl}/api/applications/${applicationId}/assessment-record`;
    const settingsUrl = `${apiBaseUrl}/api/settings`;

    const headers = {
      'Content-Type': 'application/json'
    };

    if (authToken) {
      headers['Authorization'] = `Bearer ${authToken}`;
    }

    console.log('Fetching application from:', applicationUrl);
    const applicationResponse = await fetch(applicationUrl, {
      method: 'GET',
      headers: headers,
      credentials: 'include'
    });

    if (!applicationResponse.ok) {
      if (applicationResponse.status === 401) {
        throw new Error('Unauthorized. Please login again.');
      }
      if (applicationResponse.status === 404) {
        throw new Error('Application not found.');
      }
      throw new Error(`HTTP Error: ${applicationResponse.status} ${applicationResponse.statusText}`);
    }

    const applicationData = await applicationResponse.json();
    console.log('Application data loaded:', applicationData);

    let assessmentData = null;
    console.log('Fetching assessment from:', assessmentUrl);

    const assessmentResponse = await fetch(assessmentUrl, {
      method: 'GET',
      headers: headers,
      credentials: 'include'
    });

    if (assessmentResponse.ok) {
      assessmentData = await assessmentResponse.json();
      console.log('Assessment data loaded:', assessmentData);
    } else if (assessmentResponse.status === 404) {
      console.warn('Assessment record not found, building from application data');
      assessmentData = {
        business_name: applicationData.entity_name || 'N/A',
        owner_name: applicationData.contact_person || applicationData.entity_name || 'N/A',
        address: applicationData.parameters?.find(p => p.param_name.toLowerCase().includes('address'))?.param_value || 'N/A',
        app_number: applicationData.application_number || `#${applicationData.application_id}`,
        app_type: applicationData.permit_type || 'NEW',
        app_date: applicationData.created_at,
        created_at: applicationData.updated_at || applicationData.created_at,
        fees: (applicationData.assessed_fees || []).map(fee => ({
          fee_name: fee.fee_name,
          amount: fee.assessed_amount,
          quantity: 1,
          balance_due: fee.assessed_amount,
          surcharge: 0,
          interest: 0,
          total: fee.assessed_amount,
          category_name: fee.category_name
        })),
        total_amount_due: (applicationData.assessed_fees || []).reduce((sum, fee) => sum + parseFloat(fee.assessed_amount || 0), 0),
        q1_amount: 0,
        q2_amount: 0,
        q3_amount: 0,
        q4_amount: 0
      };
    } else if (assessmentResponse.status === 401) {
      throw new Error('Unauthorized. Please login again.');
    } else {
      throw new Error(`HTTP Error: ${assessmentResponse.status} ${assessmentResponse.statusText}`);
    }

    let settings = {};
    try {
      const settingsResponse = await fetch(settingsUrl, {
        method: 'GET',
        headers: headers,
        credentials: 'include'
      });
      if (settingsResponse.ok) {
        settings = await settingsResponse.json();
      }
    } catch (settingsError) {
      console.warn('Could not fetch settings, using defaults:', settingsError);
    }

    renderReport(assessmentData, settings, applicationData);
  } catch (error) {
    console.error('Error fetching assessment data:', error);
    showError(`Failed to load assessment report: ${error.message}`);
  }
}

function renderReport(appData, settings = {}, applicationData = {}) {
  const reportHTML = generateReportHTML(appData, settings, applicationData);

  document.getElementById('report-content').innerHTML = reportHTML;
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('report-content').classList.remove('hidden');

  // Store original content for revert functionality
  originalContent = appData;
  currentContent = JSON.parse(JSON.stringify(appData));

  // Apply customizations if they exist
  if (customizationData && customizationData.customContent) {
    applyCustomizations(customizationData.customContent);
  }

  // Auto-size content and paginate if needed
  setTimeout(() => {
    paginateContent();
  }, 150);
}

/**
 * Automatically paginate content when pages overflow.
 * Moves trailing sections to continuation pages until all content fits.
 */
function paginateContent() {
  window.ReportPaginationCommon.paginateDocumentPages({
    firstPageId: 'page-1',
    updatePageNumbers: updatePageNumbers
  });
}

/**
 * Update page numbers in the document
 */
function updatePageNumbers() {
  const pages = document.querySelectorAll('.page');
  const totalPages = pages.length;
  
  pages.forEach((page, index) => {
    const pageNumEl = page.querySelector('.page-number');
    const totalPagesEl = page.querySelector('.total-pages');
    
    if (pageNumEl) pageNumEl.textContent = index + 1;
    if (totalPagesEl) totalPagesEl.textContent = totalPages;
  });
}

function applyCustomizations(customContent) {
  // Apply custom values to rendered report
  if (customContent.business_name) {
    const elem = document.querySelectorAll('[data-edit-field="business_name"]')[0];
    if (elem) elem.textContent = customContent.business_name;
  }
  if (customContent.owner_name) {
    const elem = document.querySelectorAll('[data-edit-field="owner_name"]')[0];
    if (elem) elem.textContent = customContent.owner_name;
  }
  if (customContent.address) {
    const elem = document.querySelectorAll('[data-edit-field="address"]')[0];
    if (elem) elem.textContent = customContent.address;
  }
}

function toggleEditMode() {
  if (!userCanEdit) {
    showError('You do not have permission to edit this report');
    return;
  }

  editMode = !editMode;

  document.getElementById('editBtn').style.display = editMode ? 'none' : 'inline-block';
  document.getElementById('printBtn').disabled = editMode;
  document.getElementById('downloadBtn').disabled = editMode;
  document.getElementById('saveBtn').style.display = editMode ? 'inline-block' : 'none';
  document.getElementById('cancelBtn').style.display = editMode ? 'inline-block' : 'none';
  document.getElementById('revertBtn').style.display = editMode ? 'inline-block' : 'none';
  document.getElementById('editModeIndicator').classList.toggle('active');

  if (editMode) {
    initializeEditFields();
  } else {
    // Cancel edit mode - revert UI
    document.querySelectorAll('[data-edit-field]').forEach(elem => {
      elem.classList.remove('edit-mode');
    });
    destroyQuillEditors();
  }
}

function initializeEditFields() {
  const editableElements = document.querySelectorAll('[data-edit-field]');

  editableElements.forEach(elem => {
    const fieldName = elem.dataset.editField;
    const fieldType = elem.dataset.editType || 'text';

    // Store original value
    if (!elem.dataset.originalValue) {
      elem.dataset.originalValue = elem.textContent;
    }

    // Get current value (from customization or original)
    const currentValue = customizationData?.customContent?.[fieldName] || currentContent[fieldName] || elem.textContent;

    if (fieldType === 'richtext') {
      createRichTextEditor(elem, fieldName, currentValue);
    } else {
      createTextInput(elem, fieldName, currentValue);
    }

    elem.classList.add('edit-mode');
  });
}

function createTextInput(elem, fieldName, value) {
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'text-edit-input';
  input.value = value || '';
  input.dataset.fieldName = fieldName;

  elem.textContent = '';
  elem.appendChild(input);
}

function createRichTextEditor(elem, fieldName, value) {
  const editorId = `editor-${fieldName}`;
  const container = document.createElement('div');
  container.id = editorId;
  container.innerHTML = value || '';

  elem.textContent = '';
  elem.appendChild(container);

  const quill = new Quill(`#${editorId}`, {
    theme: 'snow',
    modules: {
      toolbar: [
        ['bold', 'italic', 'underline'],
        ['list'],
        ['link']
      ]
    }
  });

  quillEditors[fieldName] = quill;
}

function destroyQuillEditors() {
  Object.values(quillEditors).forEach(editor => {
    // Quill doesn't have a destroy method, but we can clear the reference
  });
  quillEditors = {};
}

async function saveCustomization() {
  try {
    // Collect edited content
    const customContent = {};

    // Collect text inputs
    document.querySelectorAll('input.text-edit-input').forEach(input => {
      const fieldName = input.dataset.fieldName;
      customContent[fieldName] = input.value;
    });

    // Collect Quill editors
    Object.keys(quillEditors).forEach(fieldName => {
      customContent[fieldName] = quillEditors[fieldName].root.innerHTML;
    });

    console.log('Saving customization:', customContent);

    const response = await fetch(
      `${apiBaseUrl}/api/applications/${applicationId}/report-customization/${currentReportType}`,
      {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${authToken}`
        },
        body: JSON.stringify({
          customContent,
          isSaved: true
        }),
        credentials: 'include'
      }
    );

    if (!response.ok) {
      const errorData = await response.json();
      throw new Error(errorData.error || 'Failed to save customization');
    }

    const result = await response.json();
    modalAlert('Report changes saved successfully!');

    // Exit edit mode
    editMode = true;
    toggleEditMode();

    // Reload customizations
    await loadCustomization();

    // Re-render with updated data
    fetchAssessmentReport();
  } catch (error) {
    console.error('Save customization error:', error);
    modalAlert('Error saving changes: ' + error.message);
  }
}

async function revertToOriginal() {
  modalConfirm('Are you sure you want to discard all edits and restore the original report?', 'Confirm', async () => {
    try {
      const response = await fetch(
        `${apiBaseUrl}/api/applications/${applicationId}/report-customization/${currentReportType}`,
        {
          method: 'DELETE',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${authToken}`
          },
          credentials: 'include'
        }
      );

      if (!response.ok) {
        const errorData = await response.json();
        throw new Error(errorData.error || 'Failed to revert');
      }

      modalAlert('Report reverted to original content');

      // Clear customization data
    customizationData = null;

    // Exit edit mode
    editMode = true;
    toggleEditMode();

    // Re-render with original data
    fetchAssessmentReport();
    } catch (error) {
      console.error('Revert error:', error);
      modalAlert('Error reverting changes: ' + error.message);
    }
  });
}

function showError(message) {
  document.getElementById('error').textContent = message;
  document.getElementById('error').classList.remove('hidden');
  document.getElementById('loading').classList.add('hidden');
}

function printReport() {
  window.print();
}

function downloadPDF() {
  modalAlert('To save as PDF, use the Print dialog and select "Save as PDF" as the destination.');
  window.print();
}

// Generate Report PDF
// Generate PDF via Puppeteer (server-side)
async function generateReportPDF() {
  const reportPdfBtn = document.getElementById('reportPdfBtn');
  const reportError = document.getElementById('reportError');

  try {
    const reportContent = document.getElementById('report-content');
    if (!reportContent || reportContent.classList.contains('hidden')) {
      throw new Error('Report not loaded yet. Wait for the assessment to load first.');
    }

    reportPdfBtn.disabled = true;
    reportPdfBtn.innerHTML = '⏳ Generating PDF...';
    reportError.classList.remove('show');

    // Collect all <style> blocks from the page for embedding
    const styleText = Array.from(document.querySelectorAll('style'))
      .map(s => s.innerHTML).join('\n');

    // Build a self-contained HTML document for Puppeteer
    const fullHtml = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
${styleText}
body { background: white; margin: 0; padding: 0; }
.controls { display: none !important; }
.edit-mode-indicator { display: none !important; }
.ql-toolbar { display: none !important; }
.text-edit-input { display: none !important; }
.edit-toolbar { display: none !important; }
#report-container { box-shadow: none; margin: 0; max-width: 100%; }
.page { box-shadow: none; margin: 0; }
</style>
</head>
<body>
<div id="report-container">
${reportContent.innerHTML}
</div>
</body>
</html>`;

    const meta = window.assessmentReportMeta || {};
    const date = new Date().toISOString().split('T')[0];
    const filename = `Assessment_Report_${date}.pdf`;

    const response = await fetch(`${apiBaseUrl}/api/reports/generate-from-html`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        ...(authToken && { 'Authorization': `Bearer ${authToken}` })
      },
      body: JSON.stringify({ html: fullHtml, filename, pageSize: 'legal' })
    });

    if (!response.ok) {
      const err = await response.json().catch(() => ({ error: 'Server error' }));
      throw new Error(err.error || `HTTP ${response.status}`);
    }

    const blob = await response.blob();
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    window.URL.revokeObjectURL(url);

    reportPdfBtn.innerHTML = '✅ Downloaded!';
    setTimeout(() => {
      reportPdfBtn.innerHTML = '📊 Generate Assessment Report (PDF)';
      reportPdfBtn.disabled = false;
    }, 2000);

  } catch (error) {
    reportError.textContent = `Error: ${error.message}`;
    reportError.classList.add('show');
    setTimeout(() => reportError.classList.remove('show'), 5000);
    reportPdfBtn.innerHTML = '📊 Generate Assessment Report (PDF)';
    reportPdfBtn.disabled = false;
  }
}

function generateReportHTML(data, settings = {}, applicationData = {}) {
  const now = new Date();

  const formatDate = (dateStr) => {
    if (!dateStr) return 'N/A';
    const date = new Date(dateStr);
    return date.toLocaleDateString('en-US', {
      year: 'numeric',
      month: 'long',
      day: 'numeric'
    });
  };

  const getLastWeekdayOfMonth = (baseDate) => {
    const date = new Date(baseDate);
    const year = date.getFullYear();
    const month = date.getMonth();
    const lastDay = new Date(year, month + 1, 0);
    const dayOfWeek = lastDay.getDay();
    if (dayOfWeek === 6) {
      lastDay.setDate(lastDay.getDate() - 1);
    } else if (dayOfWeek === 0) {
      lastDay.setDate(lastDay.getDate() - 2);
    }
    return lastDay;
  };

  const appDate = data.app_date ? new Date(data.app_date) : new Date();
  const validityDate = getLastWeekdayOfMonth(appDate);
  const validityDateFormatted = formatDate(validityDate);

  const formatCurrency = (value) => {
    const num = parseFloat(value) || 0;
    return '₱ ' + num.toLocaleString('en-PH', {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });
  };

  const formatTableAmount = (value) => {
    const num = parseFloat(value) || 0;
    return num.toLocaleString('en-PH', {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });
  };

  const feesByCategory = {};
  let categoryOrder = [];

  if (data.fees && Array.isArray(data.fees)) {
    data.fees.forEach(fee => {
      const category = fee.category_name || 'Other Charges';
      if (!feesByCategory[category]) {
        feesByCategory[category] = [];
        categoryOrder.push(category);
      }
      feesByCategory[category].push(fee);
    });
  }

  categoryOrder.sort((a, b) => {
    const aIsReg = a.toLowerCase().includes('regulatory') || a.toLowerCase().includes('reg');
    const bIsReg = b.toLowerCase().includes('regulatory') || b.toLowerCase().includes('reg');
    if (aIsReg && !bIsReg) return -1;
    if (!aIsReg && bIsReg) return 1;
    return a.localeCompare(b);
  });

  let feesHtml = '';
  let totalAmount = 0;
  let totalDiscount = 0;
  let totalSurcharge = 0;
  let totalInterest = 0;
  let totalFees = 0;

  categoryOrder.forEach((category, categoryIndex) => {
    const categoryFees = feesByCategory[category];
    const isLastCategory = categoryIndex === categoryOrder.length - 1;

    feesHtml += `
      <tr style="background-color: transparent; font-weight: bold;">
        <td style="border: none; padding: 4px;">${category}</td>
        <td style="border: none; padding: 4px; text-align: right;"></td>
        <td style="border: none; padding: 4px; text-align: right;"></td>
        <td style="border: none; padding: 4px; text-align: right;"></td>
        <td style="border: none; padding: 4px; text-align: right;"></td>
        <td style="border: none; padding: 4px; text-align: right;"></td>
      </tr>
    `;

    categoryFees.forEach((fee, feeIndex) => {
      const isLastFee = isLastCategory && feeIndex === categoryFees.length - 1;
      const borderStyle = isLastFee ? 'border-bottom: 2px solid #333;' : '';

      const feeAmount = parseFloat(fee.amount || 0);
      const feeSurcharge = parseFloat(fee.surcharge || 0);
      const feeInterest = parseFloat(fee.interest || 0);
      const feeTotal = parseFloat(fee.total || fee.amount || 0);

      totalAmount += feeAmount;
      totalSurcharge += feeSurcharge;
      totalInterest += feeInterest;
      totalFees += feeTotal;

      feesHtml += `
        <tr style="${borderStyle}">
          <td style="border: none; padding: 3px; padding-left: 20px;">${fee.fee_name}</td>
          <td style="border: none; padding: 3px; text-align: right;">${formatTableAmount(feeAmount)}</td>
          <td style="border: none; padding: 3px; text-align: right;">0.00</td>
          <td style="border: none; padding: 3px; text-align: right;">${formatTableAmount(feeSurcharge)}</td>
          <td style="border: none; padding: 3px; text-align: right;">${formatTableAmount(feeInterest)}</td>
          <td style="border: none; padding: 3px; text-align: right;">${formatTableAmount(feeTotal)}</td>
        </tr>
      `;
    });
  });

  feesHtml += `
    <tr style="font-weight: bold; background-color: transparent;">
      <td style="border: none; padding: 4px;">TOTAL</td>
      <td style="border: none; padding: 4px; text-align: right;">${formatTableAmount(totalAmount)}</td>
      <td style="border: none; padding: 4px; text-align: right;">0.00</td>
      <td style="border: none; padding: 4px; text-align: right;">${formatTableAmount(totalSurcharge)}</td>
      <td style="border: none; padding: 4px; text-align: right;">${formatTableAmount(totalInterest)}</td>
      <td style="border: none; padding: 4px; text-align: right;">${formatTableAmount(totalFees)}</td>
    </tr>
  `;

  const currentUserName = data.prepared_by_name || 'PAMS';

  // Get API base URL for logo URLs
  const apiBaseUrl = typeof window !== 'undefined' ? window.location.origin : '';
  
  // Get header settings
  const getLogoUrl = (url) => {
    if (!url) return null;
    if (url.startsWith('http')) return url;

    return url;

  const logoLeftUrl  = getLogoUrl(settings.assessment_header_logo_left?.value)  || null;

            <div style="text-align: center; line-height: 1.2;">

        <!-- Title -->

        <div style="margin-bottom: 20px; font-size: 13px; page-break-after: avoid;">

              <td style="width: 50%; vertical-align: top;">
                <div style="margin-bottom: 2px;"><strong style="display: inline-block; width: 80px;">Trade Name:</strong> <span class="editable-field" data-edit-field="business_name" data-edit-type="text">${data.business_name || 'N/A'}</span></div>

                <div style="margin-bottom: 2px;"><strong style="display: inline-block; width: 80px;">Proprietor:</strong> <span class="editable-field" data-edit-field="owner_name" data-edit-type="text">${data.owner_name || 'N/A'}</span></div>
              </td>
              <td style="width: 50%; vertical-align: top; padding-left: 20px;">
                <div style="margin-bottom: 2px;"><strong style="display: inline-block; width: 120px;">Application No:</strong> ${data.app_number || 'N/A'}</div>
                <div style="margin-bottom: 2px;"><strong style="display: inline-block; width: 120px;">Date:</strong> ${formatDate(data.app_date)}</div>
                <div style="margin-bottom: 2px;"><strong style="display: inline-block; width: 120px;">Type:</strong> ${data.app_type || 'NEW'} (${new Date(data.app_date).getFullYear()})</div>
