<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
<meta charset="utf-8"/>
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap');
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    margin: 0;
    padding: 0;
    background-color: #f5f5f5;
    font-family: 'Cambria', 'Noto Serif', 'Georgia', serif;
  }
  #report-container {
    max-width: 13in;
    margin: 20px auto;
    background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .loading {
    padding: 40px;
    text-align: center;
    font-size: 18px;
    color: #666;
  }
  .error {
    padding: 20px;
    background-color: #fff3cd;
    border: 1px solid #ffc107;
    border-radius: 4px;
    color: #856404;
    margin: 20px;
  }
  .controls {
    padding: 15px;
    background-color: #f8f9fa;
    border-bottom: 1px solid #dee2e6;
    text-align: right;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .btn {
    padding: 8px 16px;
    margin-left: 5px;
    background-color: #007bff;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
  }
  .btn:hover {
    background-color: #0056b3;
  }
  .btn:disabled {
    background-color: #6c757d;
    cursor: not-allowed;
  }
  .btn-print {
    background-color: #28a745;
  }
  .btn-print:hover {
    background-color: #1e7e34;
  }
  .report-pdf-btn {
    padding: 8px 16px;
    margin-left: 5px;
    background-color: #6366f1;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
  }
  .report-pdf-btn:hover:not(:disabled) {
    background-color: #4f46e5;
  }
  .report-pdf-btn:disabled {
    background-color: #ccc;
    cursor: not-allowed;
  }
  .report-error {
    padding: 12px;
    background-color: #fee;
    border: 1px solid #fcc;
    border-radius: 4px;
    color: #c33;
    margin: 10px 15px;
    font-size: 13px;
    display: none;
  }
  .report-error.show {
    display: block;
  }

  /* Page container — 13 × 8.5 in legal landscape */
  .page {
    width: 13in;
    height: 8.5in;
    padding: 0.5in;
    padding-bottom: 0.75in;
    margin: 0 auto 20px auto;
    background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    position: relative;
    page-break-after: always;
    box-sizing: border-box;
    overflow: hidden;
  }
  .page:last-child {
    page-break-after: avoid;
  }
  .page-content {
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  .page-footer {
    position: absolute;
    /*
     * Anchor at the very bottom and cover the ENTIRE padding-bottom zone (0.75 in).
     * This creates a solid white blocker so any content that slightly overflows
     * the content area never visually reaches the footer text.
     * Text is pushed down by padding-top: 0.40 in so it appears at the same
     * visual position as the original bottom: 0.35 in placement.
     */
    bottom: 0;
    left: 0.5in;
    right: 0.5in;
    height: 0.75in;
    padding-top: 0.40in;
    text-align: center;
    font-size: 8px;
    color: #666;
    background: white;
  }
  /* The inner <div> carries the visible top border + text gap */
  .page-footer > div {
    border-top: 1px solid #ccc;
    padding-top: 6px;
  }
  .hidden {
    display: none;
  }

  /* Citation table */
  .citation-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 10.5px;
    margin-top: 10px;
  }
  .citation-table th {
    border: 1px solid #333;
    padding: 6px 8px;
    background-color: #f0f0f0;
    font-weight: bold;
    text-align: center;
    font-size: 11px;
  }
  .citation-table td {
    border: 1px solid #555;
    padding: 5px 8px;
    vertical-align: top;
  }
  .citation-table td.center {
    text-align: center;
  }
  .citation-table td.right {
    text-align: right;
  }
  .citation-table tfoot td {
    border: 1px solid #333;
    padding: 6px 8px;
    font-weight: bold;
    background-color: #f0f0f0;
  }

  /* Continuation header */
  .continuation-header {
    text-align: center;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid #ccc;
  }
  .continuation-header h3 {
    font-size: 13px;
    color: #666;
  }

  /* Summary section */
  .summary-box {
    margin-top: 10px;
    padding: 8px 12px;
    border: 1px solid #999;
    font-size: 11px;
    line-height: 1.55;
  }

  /* Signatory block (last page) */
  .signatory-block {
    margin-top: 18px;
  }
  .signatory-block table {
    width: 100%;
    border-collapse: collapse;
  }
  .signatory-block td {
    width: 50%;
    vertical-align: top;
    padding: 4px 8px;
  }
  .sig-label {
    font-size: 9px;
    color: #444;
    margin-bottom: 20px;
  }
  .sig-line {
    display: inline-block;
    min-width: 200px;
    padding-top: 3px;
  }
  .sig-name {
    font-size: 10.5px;
    font-weight: bold;
    text-transform: uppercase;
  }
  .sig-position {
    font-size: 9px;
    font-style: italic;
    color: #1a56db;
  }

  /* Enforcer group header row */
  .enforcer-group-header td {
    background: #dce5f3;
    font-weight: bold;
    font-size: 10.5px;
    padding: 5px 8px;
    border: 1px solid #333;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* Enforcer subtotal row */
  .enforcer-subtotal td {
    background: #eef3e8;
    font-weight: bold;
    font-size: 10.5px;
    border: 1px solid #555;
  }

  @page {
    size: 13in 8.5in landscape;
    margin: 0;
  }
  @media print {
    body {
      background: white;
      margin: 0;
      padding: 0;
    }
    #report-container {
      box-shadow: none;
      margin: 0;
      max-width: 100%;
    }
    .controls {
      display: none !important;
    }
    .page {
      box-shadow: none;
      margin: 0;
      width: 13in;
      height: 8.5in;
      page-break-after: always;
      overflow: hidden;
    }
    .page:last-child {
      page-break-after: avoid;
    }
  }
</style>
<title>Citation Ticket Report</title>
</head>
<body>
<div id="report-container">
  <div class="controls">
    <button class="btn btn-print" onclick="printReport()">🖨️ Print</button>
    <button class="report-pdf-btn" id="reportPdfBtn" onclick="generateReportPDF()">📄 Download PDF</button>
    <div id="reportError" class="report-error"></div>
  </div>

  <div id="loading" class="loading">
    <p>Loading citation report...</p>
  </div>

  <div id="error" class="error hidden"></div>
  <div id="report-content" class="hidden"></div>
</div>

<script src="js/modal-dialog.js"></script>
<script src="/js/report-pagination-common.js"></script>
<script>
// ── URL parameters ──────────────────────────────────────────────────────────
const urlParams    = new URLSearchParams(window.location.search);
const paymentStatus = urlParams.get('paymentStatus') || 'all';
const dateFrom      = urlParams.get('dateFrom')      || '';
const dateTo        = urlParams.get('dateTo')        || '';
const violationFilter = urlParams.get('violations')  || '';
const authToken     = urlParams.get('token') || localStorage.getItem('token') || '';
// Header group: 'permit' | 'assessment' | 'disco'  (default: permit)
const headerGroup   = urlParams.get('header') || 'permit';
// Group citations by enforcer in the report
const groupByEnforcer = urlParams.get('groupByEnforcer') === '1';

// ── API base URL ─────────────────────────────────────────────────────────────
const apiBaseUrl = window.location.origin;

// ── Bootstrap ────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function () {
  loadReport();
});

async function loadReport() {
  try {
    const headers = { 'Content-Type': 'application/json' };
    if (authToken) headers['Authorization'] = `Bearer ${authToken}`;

    // Fetch citations ──────────────────────────────────────────────────────
    // NOTE: Do NOT pass paymentStatus to the API — the backend filters on the
    // raw c.payment_status column, which differs from the computed payment_status
    // returned in the response (computed from actual payment totals). The correct
    // filter is applied client-side below on the computed value.
    let citationsUrl = `${apiBaseUrl}/api/citations?limit=10000`;
    if (dateFrom) citationsUrl += `&dateFrom=${encodeURIComponent(dateFrom)}`;
    if (dateTo)   citationsUrl += `&dateTo=${encodeURIComponent(dateTo)}`;

    const citationsRes = await fetch(citationsUrl, { method: 'GET', headers, credentials: 'include' });
    if (!citationsRes.ok) {
      if (citationsRes.status === 401) throw new Error('Unauthorised. Please log in again.');
      throw new Error(`HTTP ${citationsRes.status} ${citationsRes.statusText}`);
    }
    let citations = (await citationsRes.json()).data || [];

    // Re-apply payment status filter client-side so computed statuses (from the
    // server CASE expression) are consistent with the filter label in the report.
    // Partial filter → Partially Paid / Installment; Paid filter includes partials.
    if (paymentStatus && paymentStatus !== 'all') {
      const partialStatuses = ['Partially Paid', 'Installment', 'Partial'];
      citations = citations.filter(c => {
        const status = (c.payment_status || '').trim();
        if (paymentStatus === 'Partial') return partialStatuses.includes(status);
        if (paymentStatus === 'Paid') return status === 'Paid' || partialStatuses.includes(status);
        return status === paymentStatus;
      });
    }

    // Client-side violation filter
    if (violationFilter) {
      citations = citations.filter(c => {
        const v = c.violations || [];
        return Array.isArray(v) ? v.includes(violationFilter) : false;
      });
    }

    // Fetch settings ───────────────────────────────────────────────────────
    let settings = {};
    try {
      const settingsRes = await fetch(`${apiBaseUrl}/api/settings`, { method: 'GET', headers, credentials: 'include' });
      if (settingsRes.ok) settings = await settingsRes.json();
    } catch (_) { /* non-critical */ }

    // Fetch current user ───────────────────────────────────────────────────
    let currentUserName = 'PAMS';
    try {
      const meRes = await fetch(`${apiBaseUrl}/api/auth/me`, { method: 'GET', headers, credentials: 'include' });
      if (meRes.ok) {
        const meData = await meRes.json();
        if (meData.full_name) currentUserName = meData.full_name;
      }
    } catch (_) { /* non-critical */ }

    renderReport(citations, settings, currentUserName);

  } catch (err) {
    console.error('Error loading citation report:', err);
    showError(`Failed to load citation report: ${err.message}`);
  }
}

// ── Render ───────────────────────────────────────────────────────────────────
async function renderReport(citations, settings, currentUserName) {
  let html;
  if (groupByEnforcer) {
    html = buildGroupedReportHTML(citations, settings, currentUserName);
  } else {
    const rowHeights = await measureRowHeights(citations);
    html = buildReportHTML(citations, rowHeights, settings, currentUserName);
  }
  document.getElementById('report-content').innerHTML = html;
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('report-content').classList.remove('hidden');
  updatePageNumbers();
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function formatDate(dateStr) {
  if (!dateStr) return 'N/A';
  const d = new Date(dateStr);
  if (isNaN(d)) return dateStr;
  return d.toLocaleDateString('en-US', { year: 'numeric', month: '2-digit', day: '2-digit' });
}

function formatCurrency(value) {
  const n = parseFloat(value) || 0;
  return '₱' + n.toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

/** Amount shown in the report: paid/partial → amount received (with OR); otherwise assessed fine. */
function isPaidOrPartialStatus(status) {
  const s = (status || '').trim();
  return s === 'Paid' || s === 'Partially Paid' || s === 'Installment' || s === 'Partial';
}

function reportAmount(c) {
  if (isPaidOrPartialStatus(c.payment_status)) {
    const paid = parseFloat(c.total_paid);
    if (!isNaN(paid) && paid > 0) return paid;
  }
  return parseFloat(c.fine_amount) || 0;
}

function buildFilterLabel() {
  const parts = [];
  if (paymentStatus && paymentStatus !== 'all') parts.push(`Status: ${paymentStatus}`);
  if (dateFrom) parts.push(`From: ${dateFrom}`);
  if (dateTo)   parts.push(`To: ${dateTo}`);
  if (violationFilter) parts.push(`Violation: ${violationFilter}`);
  return parts.length ? parts.join('  |  ') : 'All Citations';
}

// ── Header defaults per group ────────────────────────────────────────────────
const HEADER_DEFAULTS = {
  permit:     { line4: 'OFFICE OF THE MUNICIPAL MAYOR', line5: 'Tel. # 520 4141 loc. 315' },
  assessment: { line4: 'MUNICIPAL TREASURER\'S OFFICE', line5: '' },
  disco:      { line4: 'OFFICE OF THE MUNICIPAL MAYOR', line5: '' },
};

// ── Header HTML ───────────────────────────────────────────────────────────────
function buildHeaderHTML(settings) {
  const pfx = headerGroup + '_header';
  const def = HEADER_DEFAULTS[headerGroup] || HEADER_DEFAULTS.permit;
  const getLogoUrl = (url) => {
    if (!url) return null;
    if (url.startsWith('http')) return url;
    if (url.startsWith('/api/')) return `${apiBaseUrl}${url}`;
    return url;
  };

  const logoLeftUrl  = getLogoUrl(settings[pfx + '_logo_left']?.value)  || '/dalaguete-logo.png';
  const logoRightUrl = getLogoUrl(settings[pfx + '_logo_right']?.value) || null;

  const hLogoH = Math.max(20, Math.min(120, parseFloat(settings[pfx + '_logo_size']?.value) || 50));

  const hLine1 = settings[pfx + '_line_1']?.value !== undefined ? settings[pfx + '_line_1'].value : 'REPUBLIC OF THE PHILIPPINES';
  const hLine2 = settings[pfx + '_line_2']?.value !== undefined ? settings[pfx + '_line_2'].value : 'MUNICIPALITY OF DALAGUETE';
  const hLine3 = settings[pfx + '_line_3']?.value !== undefined ? settings[pfx + '_line_3'].value : 'PROVINCE OF CEBU';
  const hLine4 = settings[pfx + '_line_4']?.value !== undefined ? settings[pfx + '_line_4'].value : def.line4;
  const hLine5 = settings[pfx + '_line_5']?.value !== undefined ? settings[pfx + '_line_5'].value : def.line5;

  const hBasePx = Math.max(7, Math.min(20, parseFloat(settings[pfx + '_font_size']?.value) || 11));
  const hLine4Px = Math.round(hBasePx * 1.45);

  const headerTextLines = `
    ${hLine1 ? `<div style="font-size:${hBasePx}px;font-weight:bold;">${hLine1}</div>` : ''}
    ${hLine2 ? `<div style="font-size:${hBasePx}px;font-weight:bold;">${hLine2}</div>` : ''}
    ${hLine3 ? `<div style="font-size:${hBasePx}px;font-weight:bold;">${hLine3}</div>` : ''}
    ${hLine4 ? `<div style="font-size:${hLine4Px}px;font-weight:bold;margin-top:2px;">${hLine4}</div>` : ''}
    ${hLine5 ? `<div style="font-size:${hBasePx}px;font-weight:bold;margin-top:2px;">${hLine5}</div>` : ''}
  `;

  return `
    <div style="text-align:center;margin-bottom:16px;">
      <div style="display:flex;justify-content:center;align-items:center;gap:16px;margin-bottom:6px;">
        ${logoLeftUrl ? `<img src="${logoLeftUrl}" alt="Logo" style="height:${hLogoH}px;width:auto;object-fit:contain;">` : ''}
        <div style="text-align:center;line-height:1.2;">${headerTextLines}</div>
        ${logoRightUrl ? `<img src="${logoRightUrl}" alt="Logo 2" style="height:${hLogoH}px;width:auto;object-fit:contain;">` : ''}
      </div>
      <div style="border-bottom:2px solid #333;margin-top:6px;"></div>
    </div>
  `;
}

// ── Footer HTML ───────────────────────────────────────────────────────────────
function buildFooterHTML(currentUserName, issuedAt) {
  return `
    <div>Generated by: ${currentUserName} | Permit and Assessment Management System | Issued: ${issuedAt} | Page <span class="page-number"></span> of <span class="total-pages"></span></div>
  `;
}

// ── Table header row ──────────────────────────────────────────────────────────
function tableHeaderRow() {
  return `
    <tr>
      <th style="width:3%;">#</th>
      <th style="width:8%;">Ticket No.</th>
      <th style="width:6%;">Date</th>
      <th style="width:11%;">Driver Name</th>
      <th style="width:10%;">Address</th>
      <th style="width:10%;">Violation Location</th>
      <th style="width:6%;">Violation Time</th>
      <th style="width:7%;">O.R. No.</th>
      <th style="width:27%;">Violations</th>
      <th style="width:12%;">Amount</th>
    </tr>
  `;
}

function citationRowCellsHTML(c, rowNum) {
  const violations = Array.isArray(c.violations)
    ? c.violations.join('; ')
    : (c.violations || 'N/A');
  return `
        <td class="center" style="width:3%">${rowNum}</td>
        <td class="center" style="width:8%">${c.ticket_number  || 'N/A'}</td>
        <td class="center" style="width:6%">${formatDate(c.violation_date)}</td>
        <td style="width:11%">${c.driver_name  || 'N/A'}</td>
        <td style="width:10%">${c.driver_address || '—'}</td>
        <td style="width:10%">${c.violation_location || '—'}</td>
        <td class="center" style="width:6%">${c.violation_time || '—'}</td>
        <td class="center" style="width:7%">${c.receipt_number || '—'}</td>
        <td style="width:27%">${violations}</td>
        <td class="right"  style="width:12%">${formatCurrency(reportAmount(c))}</td>
      `;
}

// ── Page geometry constants (px at 96 DPI) ───────────────────────────────────
// Page 13 × 8.5 in landscape  |  padding: 0.5 in top, 0.75 in bottom
const PAG = window.ReportPaginationCommon;
const PAGE_GEO = PAG.createGeometry({
  usableH: (8.5 - 0.5 - 0.75) * 96,
  firstHdrH: 172,
  contHdrH: 66,
  theadH: 28
});
const SUMMARY_H   = 80;
const SIGNATORY_H = 90;

function measureRowHeights(citations) {
  return PAG.measureTableRowHeights({
    rows: citations,
    tableClass: 'citation-table',
    tableWidth: '12in',
    theadHTML: tableHeaderRow(),
    rowHTMLFn: (c, i) => citationRowCellsHTML(c, i + 1)
  });
}

function paginateCitations(citations, rowHeights, reserveH) {
  return PAG.paginateIndexedRows(citations, rowHeights, reserveH, PAGE_GEO);
}

// ── Main HTML builder (paginated) ─────────────────────────────────────────────
function buildSignatoryHTML(settings, currentUserName) {
  if (settings.citation_signatory_enabled?.value === 'false') return '';
  const preparedByPosition  = settings.citation_prepared_by_position?.value  || '';
  const certifiedByName     = settings.citation_certified_by_name?.value     || '';
  const certifiedByPosition = settings.citation_certified_by_position?.value || '';
  const getAssetUrl = (url) => {
    if (!url) return null;
    if (url.startsWith('http')) return url;
    if (url.startsWith('/api/')) return `${apiBaseUrl}${url}`;
    return url;
  };
  const certifiedSigUrl = getAssetUrl(settings.citation_certified_by_signature?.value);
  const certifiedSigImg = certifiedSigUrl
    ? `<img src="${certifiedSigUrl}" alt="E-Signature" style="height:36px;width:auto;max-width:140px;object-fit:contain;display:block;margin:0 auto 4px;">`
    : '';
  return `
    <div class="signatory-block">
      <table>
        <tr>
          <td>
            <div class="sig-label">Prepared by:</div>
            <div class="sig-line">
              <div class="sig-name">${currentUserName || ''}</div>
              <div class="sig-position">${preparedByPosition}</div>
            </div>
          </td>
          <td>
            <div class="sig-label">Certified correct by:</div>
            <div class="sig-line">
              ${certifiedSigImg}
              <div class="sig-name">${certifiedByName}</div>
              <div class="sig-position">${certifiedByPosition}</div>
            </div>
          </td>
        </tr>
      </table>
    </div>
  `;
}

function buildReportHTML(citations, rowHeights, settings, currentUserName) {
  const now = new Date();
  const issuedAt = now.toLocaleDateString('en-US', {
    year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
  });

  const headerHTML  = buildHeaderHTML(settings);
  const footerHTML  = buildFooterHTML(currentUserName, issuedAt);
  const filterLabel = buildFilterLabel();

  // Compute reserve height for the last page (summary + optional signatory)
  const signatoryEnabled = settings.citation_signatory_enabled?.value !== 'false';
  const reserveH = SUMMARY_H + (signatoryEnabled ? SIGNATORY_H : 0);

  // Totals — paid/partial rows use amount received (OR); pending uses fine
  const totalFines  = citations.reduce((s, c) => s + reportAmount(c), 0);
  const paidCount   = citations.filter(c => c.payment_status === 'Paid').length;
  const pendingCount = citations.filter(c => c.payment_status === 'Pending').length;
  const partialCount = citations.filter(c => c.payment_status === 'Partially Paid').length;

  // Split citations into pages using real measured row heights
  const pages = paginateCitations(citations, rowHeights, reserveH);

  // Build each page
  let pagesHTML = '';
  pages.forEach((page, pageIdx) => {
    const isLast = pageIdx === pages.length - 1;

    // Build table rows
    let rowsHTML = '';
    let rowNum = pages.slice(0, pageIdx).reduce((sum, p) => sum + p.rows.length, 0);
    page.rows.forEach(c => {
      rowNum++;
      const violations = Array.isArray(c.violations) ? c.violations.join('; ') : (c.violations || 'N/A');
      rowsHTML += `
        <tr>
          <td class="center">${rowNum}</td>
          <td class="center">${c.ticket_number || 'N/A'}</td>
          <td class="center">${formatDate(c.violation_date)}</td>
          <td>${c.driver_name || 'N/A'}</td>
          <td>${c.driver_address || '—'}</td>
          <td>${c.violation_location || '—'}</td>
          <td class="center">${c.violation_time || '—'}</td>
          <td class="center">${c.receipt_number || '—'}</td>
          <td>${violations}</td>
          <td class="right">${formatCurrency(reportAmount(c))}</td>
        </tr>
      `;
    });

    // On the last page, add totals row + summary
    let summaryHTML = '';
    if (isLast) {
      summaryHTML = `
        <tfoot>
          <tr>
            <td colspan="9" style="text-align:right;font-weight:bold;">TOTAL AMOUNT:</td>
            <td class="right" style="font-weight:bold;">${formatCurrency(totalFines)}</td>
          </tr>
        </tfoot>
      `;
    }

    // Page heading
    let pageHeading = '';
    if (page.isFirst) {
      pageHeading = `
        ${headerHTML}
        <div style="text-align:center;margin-bottom:4px;">
          <div style="font-size:16px;font-weight:bold;letter-spacing:2px;text-transform:uppercase;">CITATION TICKET REPORT</div>
          <div style="font-size:10px;color:#555;margin-top:4px;">${filterLabel}</div>
          <div style="font-size:10px;color:#555;">As of: ${issuedAt}</div>
        </div>
        <div style="border-bottom:1px solid #ccc;margin-bottom:10px;"></div>
      `;
    } else {
      pageHeading = `
        <div class="continuation-header">
          <h3>CITATION TICKET REPORT — Continuation (Page ${pageIdx + 1})</h3>
          <div style="font-size:9px;color:#555;">${filterLabel}</div>
        </div>
      `;
    }

    // Summary block (last page only)
    let statsBlock = '';
    if (isLast) {
      statsBlock = `
        <div class="summary-box">
          <strong>Total Citations:</strong> ${citations.length} &nbsp;&nbsp;
          <strong>Paid:</strong> ${paidCount} &nbsp;&nbsp;
          <strong>Pending:</strong> ${pendingCount} &nbsp;&nbsp;
          <strong>Partially Paid:</strong> ${partialCount} &nbsp;&nbsp;
          <strong>Total Amount:</strong> ${formatCurrency(totalFines)}
        </div>
      `;
    }

    // Signatory block (last page only)
    const signatoryBlock = isLast ? buildSignatoryHTML(settings, currentUserName) : '';

    pagesHTML += `
      <div class="page" id="page-${pageIdx + 1}">
        <div class="page-content">
          ${pageHeading}
          <table class="citation-table">
            <thead>${tableHeaderRow()}</thead>
            <tbody>${rowsHTML}</tbody>
            ${summaryHTML}
          </table>
          ${statsBlock}
          ${signatoryBlock}
        </div>
        <div class="page-footer">${footerHTML}</div>
      </div>
    `;
  });

  return pagesHTML;
}

// ── HTML-escape helper ────────────────────────────────────────────────────────
function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ── Group-by-enforcer helpers ─────────────────────────────────────────────────

/** Group a citations array into [{name, citations}] ordered by first appearance. */
function groupCitationsByEnforcer(citations) {
  const map = {}, order = [];
  citations.forEach(c => {
    const name = c.enforcer_name || c.issued_by_name || 'Unknown Enforcer';
    if (!map[name]) { map[name] = []; order.push(name); }
    map[name].push(c);
  });
  return order.map(n => ({ name: n, citations: map[n] }));
}

/**
 * Build a flat list of renderable items (group-header, citation, subtotal),
 * measuring each item's actual height via synchronous forced reflow.
 * Returns {html, h, type}[]  (synchronous — no Promise needed)
 */
function buildGroupedItems(groups) {
  const items  = [];
  const domTrs = [];
  let globalRowNum = 0;

  groups.forEach(g => {
    const subtotal = g.citations.reduce((s, c) => s + reportAmount(c), 0);
    const eName = escapeHtml(g.name);
    const cnt   = g.citations.length;

    // ── Group header ──
    const ghHtml = `<tr class="enforcer-group-header"><td colspan="10">` +
      `${eName} &nbsp;&mdash;&nbsp; ${cnt} citation${cnt !== 1 ? 's' : ''}</td></tr>`;
    items.push({ html: ghHtml, type: 'group-header' });
    const ghTr = document.createElement('tr');
    ghTr.className = 'enforcer-group-header';
    ghTr.innerHTML = `<td colspan="10">${eName}</td>`;
    domTrs.push(ghTr);

    // ── Citation rows ──
    g.citations.forEach(c => {
      globalRowNum++;
      const violations = Array.isArray(c.violations) ? c.violations.join('; ') : (c.violations || 'N/A');
      const rowHtml = `<tr>` +
        `<td class="center" style="width:3%">${globalRowNum}</td>` +
        `<td class="center" style="width:8%">${escapeHtml(c.ticket_number || 'N/A')}</td>` +
        `<td class="center" style="width:6%">${formatDate(c.violation_date)}</td>` +
        `<td style="width:11%">${escapeHtml(c.driver_name || 'N/A')}</td>` +
        `<td style="width:10%">${escapeHtml(c.driver_address || '\u2014')}</td>` +
        `<td style="width:10%">${escapeHtml(c.violation_location || '\u2014')}</td>` +
        `<td class="center" style="width:6%">${escapeHtml(c.violation_time || '\u2014')}</td>` +
        `<td class="center" style="width:7%">${escapeHtml(c.receipt_number || '\u2014')}</td>` +
        `<td style="width:27%">${escapeHtml(violations)}</td>` +
        `<td class="right" style="width:12%">${formatCurrency(reportAmount(c))}</td>` +
        `</tr>`;
      items.push({ html: rowHtml, type: 'citation' });
      const tr = document.createElement('tr');
      tr.innerHTML = rowHtml.slice(4, -5); // strip leading <tr> and trailing </tr>
      domTrs.push(tr);
    });

    // ── Enforcer subtotal ──
    const stHtml = `<tr class="enforcer-subtotal">` +
      `<td colspan="9" class="right">Subtotal \u2014 ${eName} (${cnt} citation${cnt !== 1 ? 's' : ''}):</td>` +
      `<td class="right">${formatCurrency(subtotal)}</td></tr>`;
    items.push({ html: stHtml, type: 'subtotal' });
    const stTr = document.createElement('tr');
    stTr.className = 'enforcer-subtotal';
    stTr.innerHTML = `<td colspan="9" class="right">Subtotal \u2014 ${eName}:</td>` +
      `<td class="right">${formatCurrency(subtotal)}</td>`;
    domTrs.push(stTr);
  });

  // Measure all rows in a single hidden table (forced synchronous reflow)
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:fixed;top:-99999px;left:-9999px;width:1152px;visibility:hidden;pointer-events:none;';
  const tbl  = document.createElement('table');
  tbl.className = 'citation-table';
  tbl.style.width = '100%';
  const thead = document.createElement('thead');
  thead.innerHTML = tableHeaderRow();
  tbl.appendChild(thead);
  const tbody = document.createElement('tbody');
  domTrs.forEach(tr => tbody.appendChild(tr));
  tbl.appendChild(tbody);
  wrap.appendChild(tbl);
  document.body.appendChild(wrap);

  // Reading offsetHeight forces synchronous layout — gives accurate row heights
  domTrs.forEach((tr, i) => { items[i].h = tr.offsetHeight || 28; });

  document.body.removeChild(wrap);
  return items; // synchronous
}

/**
 * Paginate flat grouped items.
 * Prevents orphaned group-headers (requires at least one following row on the same page).
 */
function paginateGroupedItems(items, reserveH) {
  return PAG.paginateFlatItems(items, reserveH, PAGE_GEO, function (allItems, idx, fit, used, cap, h) {
    var item = allItems[idx];
    if (item.type === 'group-header' && fit > 0) {
      var nextH = allItems[idx + 1] ? PAG.adjustedItemHeight(PAGE_GEO, allItems[idx + 1].h) : 0;
      if (used + h + nextH > cap) return true;
    }
    return false;
  });
}

/**
 * Build paginated HTML for the grouped-by-enforcer layout (synchronous).
 */
function buildGroupedReportHTML(citations, settings, currentUserName) {
  const now = new Date();
  const issuedAt = now.toLocaleDateString('en-US', {
    year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
  });

  const headerHTML  = buildHeaderHTML(settings);
  const footerHTML  = buildFooterHTML(currentUserName, issuedAt);
  const filterLabel = buildFilterLabel() + (groupByEnforcer ? '  |  Grouped by Enforcer' : '');

  const signatoryEnabled = settings.citation_signatory_enabled?.value !== 'false';
  const reserveH = SUMMARY_H + (signatoryEnabled ? SIGNATORY_H : 0);

  // Grand totals
  const totalFines   = citations.reduce((s, c) => s + reportAmount(c), 0);
  const paidCount    = citations.filter(c => c.payment_status === 'Paid').length;
  const pendingCount = citations.filter(c => c.payment_status === 'Pending').length;
  const partialCount = citations.filter(c => c.payment_status === 'Partially Paid').length;

  const groups = groupCitationsByEnforcer(citations);
  const items  = buildGroupedItems(groups);   // synchronous — forced reflow
  const pages  = paginateGroupedItems(items, reserveH);

  let pagesHTML = '';
  pages.forEach((page, pageIdx) => {
    const isLast = pageIdx === pages.length - 1;

    const rowsHTML = page.items.map(it => it.html).join('');

    const tfootHTML = isLast ? `
      <tfoot>
        <tr>
          <td colspan="9" style="text-align:right;font-weight:bold;">GRAND TOTAL:</td>
          <td class="right" style="font-weight:bold;">${formatCurrency(totalFines)}</td>
        </tr>
      </tfoot>` : '';

    const pageHeading = page.isFirst ? `
      ${headerHTML}
      <div style="text-align:center;margin-bottom:4px;">
        <div style="font-size:16px;font-weight:bold;letter-spacing:2px;text-transform:uppercase;">CITATION TICKET REPORT</div>
        <div style="font-size:10px;color:#555;margin-top:4px;">${filterLabel}</div>
        <div style="font-size:10px;color:#555;">As of: ${issuedAt}</div>
      </div>
      <div style="border-bottom:1px solid #ccc;margin-bottom:10px;"></div>
    ` : `
      <div class="continuation-header">
        <h3>CITATION TICKET REPORT — Continuation (Page ${pageIdx + 1})</h3>
        <div style="font-size:9px;color:#555;">${filterLabel}</div>
      </div>
    `;

    const statsBlock = isLast ? `
      <div class="summary-box">
        <strong>Total Citations:</strong> ${citations.length} &nbsp;&nbsp;
        <strong>Paid:</strong> ${paidCount} &nbsp;&nbsp;
        <strong>Pending:</strong> ${pendingCount} &nbsp;&nbsp;
        <strong>Partially Paid:</strong> ${partialCount} &nbsp;&nbsp;
        <strong>Total Amount:</strong> ${formatCurrency(totalFines)}
      </div>` : '';

    const signatoryBlock = isLast ? buildSignatoryHTML(settings, currentUserName) : '';

    pagesHTML += `
      <div class="page" id="page-${pageIdx + 1}">
        <div class="page-content">
          ${pageHeading}
          <table class="citation-table">
            <thead>${tableHeaderRow()}</thead>
            <tbody>${rowsHTML}</tbody>
            ${tfootHTML}
          </table>
          ${statsBlock}
          ${signatoryBlock}
        </div>
        <div class="page-footer">${footerHTML}</div>
      </div>
    `;
  });

  return pagesHTML;
}

// ── Page numbers ─────────────────────────────────────────────────────────────
function updatePageNumbers() {
  const pages = document.querySelectorAll('.page');
  const total = pages.length;
  pages.forEach((page, i) => {
    const pn = page.querySelector('.page-number');
    const tp = page.querySelector('.total-pages');
    if (pn) pn.textContent = i + 1;
    if (tp) tp.textContent = total;
  });
}

// ── Print ─────────────────────────────────────────────────────────────────────
function printReport() {
  window.print();
}

// ── Download PDF via Puppeteer (server-side) ──────────────────────────────────
async function generateReportPDF() {
  const btn        = document.getElementById('reportPdfBtn');
  const errDiv     = document.getElementById('reportError');
  const origText   = btn.innerHTML;

  try {
    const reportContent = document.getElementById('report-content');
    if (!reportContent || reportContent.classList.contains('hidden')) {
      throw new Error('Report not loaded yet.');
    }

    btn.disabled  = true;
    btn.innerHTML = '⏳ Generating PDF...';
    errDiv.classList.remove('show');

    const styleText = Array.from(document.querySelectorAll('style'))
      .map(s => s.innerHTML).join('\n');

    const fullHtml = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
${styleText}
body { background: white; margin: 0; padding: 0; }
.controls { display: none !important; }
#report-container { box-shadow: none; margin: 0; max-width: 100%; }
.page { box-shadow: none; margin: 0; }
</style>
</head>
<body>
<div id="report-container">
${reportContent.innerHTML}
</div>
</body>
</html>`;

    const date       = new Date().toISOString().split('T')[0];
    const statusLabel = (paymentStatus && paymentStatus !== 'all')
      ? paymentStatus.toUpperCase()
      : 'ALL';
    const filename = `Citation Report - ${statusLabel} - ${date}.pdf`;

    const response = await fetch(`${apiBaseUrl}/api/reports/generate-from-html`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        ...(authToken && { 'Authorization': `Bearer ${authToken}` })
      },
      body: JSON.stringify({ html: fullHtml, filename, pageSize: 'legal', landscape: true })
    });

    if (!response.ok) {
      const err = await response.json().catch(() => ({ error: 'Server error' }));
      throw new Error(err.error || `HTTP ${response.status}`);
    }

    const blob = await response.blob();
    const url  = window.URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    window.URL.revokeObjectURL(url);

    btn.innerHTML = '✅ Downloaded!';
    setTimeout(() => {
      btn.innerHTML = '📄 Download PDF';
      btn.disabled  = false;
    }, 2000);

  } catch (err) {
    errDiv.textContent = `Error: ${err.message}`;
    errDiv.classList.add('show');
    setTimeout(() => errDiv.classList.remove('show'), 5000);
    btn.innerHTML = '📄 Download PDF';
    btn.disabled  = false;
  }
}

// ── Error display ─────────────────────────────────────────────────────────────
function showError(message) {
  const el = document.getElementById('error');
  el.textContent = message;
  el.classList.remove('hidden');
  document.getElementById('loading').classList.add('hidden');
}
