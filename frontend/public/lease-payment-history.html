<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Lease Payment History</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    background: #f5f5f5;
    font-family: 'Cambria', 'Noto Serif', Georgia, serif;
  }
  #report-container {
    max-width: 8.5in;
    margin: 20px auto;
    background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .controls {
    padding: 12px 16px;
    background: #f8f9fa;
    border-bottom: 1px solid #dee2e6;
    display: flex;
    align-items: center;
    gap: 8px;
    position: sticky;
    top: 0;
    z-index: 100;
    flex-wrap: wrap;
  }
  .controls .type-pill {
    font-size: 12px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .type-pill.rights { background: #dcfce7; color: #166534; }
  .type-pill.rental { background: #dbeafe; color: #1e40af; }
  .spacer { flex: 1; }
  .btn {
    padding: 8px 14px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    color: #fff;
  }
  .btn-print { background: #28a745; }
  .btn-print:hover { background: #1e7e34; }
  .btn-print:disabled { background: #9ca3af; cursor: not-allowed; }
  .btn-close { background: #6b7280; }
  .btn-close:hover { background: #4b5563; }
  .loading, .error {
    padding: 40px 20px;
    text-align: center;
    font-size: 15px;
  }
  .error {
    color: #991b1b;
    background: #fee2e2;
    border: 1px solid #fca5a5;
    margin: 16px;
    border-radius: 6px;
  }
  .hidden { display: none; }
  .page {
    width: 8.5in;
    min-height: 11in;
    padding: 0.55in 0.55in 0.85in;
    margin: 0 auto;
    background: white;
    position: relative;
    box-sizing: border-box;
  }
  .page-footer {
    position: absolute;
    bottom: 0.35in;
    left: 0.55in;
    right: 0.55in;
    text-align: center;
    font-size: 8px;
    color: #666;
    border-top: 1px solid #ccc;
    padding-top: 6px;
  }
  .title-block {
    text-align: center;
    margin: 10px 0 16px;
  }
  .title-block h1 {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .title-block .subtitle {
    font-size: 11px;
    color: #555;
    margin-top: 2px;
  }
  .meta-grid {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 14px;
    font-size: 11px;
  }
  .meta-grid td {
    padding: 3px 6px;
    vertical-align: top;
  }
  .meta-grid .label {
    width: 22%;
    color: #555;
    font-weight: 600;
  }
  .meta-grid .value {
    width: 28%;
    font-weight: 600;
    color: #111;
  }
  .hist-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 10px;
    margin-top: 4px;
  }
  .hist-table th {
    border: 1px solid #333;
    background: #f0f0f0;
    padding: 6px 7px;
    text-align: center;
    font-weight: 700;
  }
  .hist-table td {
    border: 1px solid #555;
    padding: 5px 7px;
    vertical-align: top;
  }
  .hist-table td.right { text-align: right; font-weight: 600; }
  .hist-table td.center { text-align: center; }
  .hist-table tfoot td {
    border: 1px solid #333;
    background: #f0f0f0;
    font-weight: 700;
    padding: 6px 7px;
  }
  .summary-box {
    margin-top: 12px;
    padding: 8px 12px;
    border: 1px solid #999;
    font-size: 11px;
    line-height: 1.55;
  }
  .signatory-block { margin-top: 28px; }
  .signatory-block table { width: 100%; border-collapse: collapse; }
  .signatory-block td { width: 50%; vertical-align: top; padding: 4px 8px; }
  .sig-label { font-size: 9px; color: #444; margin-bottom: 28px; }
  .sig-name { font-size: 11px; font-weight: bold; text-transform: uppercase; }
  .sig-position { font-size: 9px; font-style: italic; color: #1a56db; }
  .empty-note {
    padding: 24px;
    text-align: center;
    color: #666;
    border: 1px dashed #bbb;
    margin-top: 8px;
    font-size: 12px;
  }
  @page { size: letter; margin: 0; }
  @media print {
    body { background: white; }
    .controls { display: none !important; }
    #report-container { box-shadow: none; margin: 0; max-width: none; }
    .page { box-shadow: none; margin: 0; }
  }
</style>
</head>
<body>
<div id="report-container">
  <div class="controls">
    <span id="typePill" class="type-pill">Payment History</span>
    <span id="loadStatus" style="font-size:12px;color:#555;"></span>
    <span class="spacer"></span>
    <button class="btn btn-close" onclick="window.close()">Close</button>
    <button class="btn btn-print" id="btnPrint" disabled onclick="window.print()">🖨 Print</button>
  </div>
  <div id="loading" class="loading">Loading payment history...</div>
  <div id="error" class="error hidden"></div>
  <div id="report-content" class="hidden"></div>
</div>

<script src="/js/rr-report-common.js"></script>
<script>
(function () {
  'use strict';

  var C = window.RRReportCommon;
  var params = new URLSearchParams(window.location.search);
  var contractId = params.get('id') || '';
  var paymentType = (params.get('type') || 'rights').toLowerCase();
  if (paymentType !== 'rights' && paymentType !== 'rental') paymentType = 'rights';
  var authToken = params.get('token') || (typeof localStorage !== 'undefined' ? localStorage.getItem('token') : '') || '';
  var apiBase = window.location.origin;

  var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  document.addEventListener('DOMContentLoaded', loadReport);

  function authHeaders() {
    var headers = { 'Content-Type': 'application/json' };
    if (authToken) headers['Authorization'] = 'Bearer ' + authToken;
    return headers;
  }

  function showError(msg) {
    document.getElementById('loading').classList.add('hidden');
    var el = document.getElementById('error');
    el.textContent = msg;
    el.classList.remove('hidden');
  }

  function formatPeriod(month, year) {
    if (!month || !year) return '—';
    return MONTHS_SHORT[month - 1] + ' ' + year;
  }

  function formatUnits(units) {
    if (!units || !units.length) return '—';
    return units.map(function (u) { return u.stall_number || 'N/A'; }).join(', ');
  }

  async function loadReport() {
    if (!contractId) {
      showError('Missing lease contract id.');
      return;
    }

    var pill = document.getElementById('typePill');
    pill.textContent = paymentType === 'rights' ? 'Rights' : 'Rentals';
    pill.className = 'type-pill ' + paymentType;
    document.title = (paymentType === 'rights' ? 'Rights' : 'Rental') + ' Payment History';

    try {
      document.getElementById('loadStatus').textContent = 'Loading...';

      var [contractRes, paymentsRes, settingsRes, meRes] = await Promise.all([
        fetch(apiBase + '/api/rights-and-rentals/lease-contracts/' + encodeURIComponent(contractId), {
          headers: authHeaders(), credentials: 'include'
        }),
        fetch(apiBase + '/api/rights-and-rentals/lease-contracts/' + encodeURIComponent(contractId) + '/payments', {
          headers: authHeaders(), credentials: 'include'
        }),
        fetch(apiBase + '/api/settings', { headers: authHeaders(), credentials: 'include' }).catch(function () { return null; }),
        fetch(apiBase + '/api/auth/me', { headers: authHeaders(), credentials: 'include' }).catch(function () { return null; })
      ]);

      if (!contractRes.ok) {
        if (contractRes.status === 401) throw new Error('Unauthorised. Please log in again.');
        var errC = await contractRes.json().catch(function () { return {}; });
        throw new Error(errC.error || ('Failed to load contract (HTTP ' + contractRes.status + ')'));
      }
      if (!paymentsRes.ok) {
        var errP = await paymentsRes.json().catch(function () { return {}; });
        throw new Error(errP.error || ('Failed to load payments (HTTP ' + paymentsRes.status + ')'));
      }

      var contract = await contractRes.json();
      var paymentsPayload = await paymentsRes.json();
      var settings = {};
      if (settingsRes && settingsRes.ok) settings = await settingsRes.json();
      var userName = 'PAMS';
      if (meRes && meRes.ok) {
        var me = await meRes.json();
        if (me.full_name) userName = me.full_name;
      }

      var allPayments = paymentsPayload.payments || [];
      var rows = allPayments
        .filter(function (p) { return p.payment_type === paymentType; })
        .sort(function (a, b) {
          return new Date(a.payment_date).getTime() - new Date(b.payment_date).getTime();
        });

      var balance = paymentsPayload.current_balance || {};
      renderReport(contract, rows, balance, settings, userName);
      document.getElementById('loadStatus').textContent = rows.length + ' record' + (rows.length === 1 ? '' : 's');
      document.getElementById('btnPrint').disabled = false;
    } catch (err) {
      console.error(err);
      showError(err.message || 'Failed to load payment history.');
      document.getElementById('loadStatus').textContent = '';
    }
  }

  function renderReport(contract, rows, balance, settings, userName) {
    var isRights = paymentType === 'rights';
    var title = isRights ? 'RIGHTS PAYMENT HISTORY' : 'RENTAL PAYMENT HISTORY';
    var subtitle = isRights
      ? 'Official record of rights payments for this lease contract'
      : 'Official record of rental payments for this lease contract';
    var balanceCol = isRights ? 'Balance' : 'Total Collected';
    var issuedAt = new Date().toLocaleString('en-PH');

    var totalPaid = rows.reduce(function (s, r) { return s + (parseFloat(r.amount_paid) || 0); }, 0);
    var effective = contract.contract_effective_date
      ? new Date(contract.contract_effective_date).toLocaleDateString('en-PH', { year: 'numeric', month: 'short', day: 'numeric' })
      : '—';
    var termination = contract.contract_termination_date
      ? new Date(contract.contract_termination_date).toLocaleDateString('en-PH', { year: 'numeric', month: 'short', day: 'numeric' })
      : 'Open-ended';

    var rowsHtml = '';
    if (!rows.length) {
      rowsHtml = '';
    } else {
      rows.forEach(function (r, i) {
        rowsHtml +=
          '<tr>' +
          '<td class="center">' + (i + 1) + '</td>' +
          '<td class="center">' + C.esc(C.fmtDate(r.payment_date)) + '</td>' +
          '<td class="center">' + C.esc(formatPeriod(r.period_month, r.period_year)) + '</td>' +
          '<td class="right">₱ ' + C.fmtCurrency(r.amount_paid) + '</td>' +
          '<td class="right">₱ ' + C.fmtCurrency(r.balance) + '</td>' +
          '<td class="center">' + C.esc(r.or_number || '—') + '</td>' +
          '</tr>';
      });
    }

    var tableHtml = rows.length
      ? (
        '<table class="hist-table">' +
        '<thead><tr>' +
        '<th style="width:6%">#</th>' +
        '<th style="width:16%">Payment Date</th>' +
        '<th style="width:14%">Period</th>' +
        '<th style="width:18%">Amount Paid</th>' +
        '<th style="width:18%">' + C.esc(balanceCol) + '</th>' +
        '<th style="width:18%">OR Number</th>' +
        '</tr></thead>' +
        '<tbody>' + rowsHtml + '</tbody>' +
        '<tfoot><tr>' +
        '<td colspan="3" class="right">TOTAL</td>' +
        '<td class="right">₱ ' + C.fmtCurrency(totalPaid) + '</td>' +
        '<td colspan="2"></td>' +
        '</tr></tfoot>' +
        '</table>'
      )
      : '<div class="empty-note">No ' + (isRights ? 'rights' : 'rental') + ' payments recorded for this lease contract.</div>';

    var summaryLines = [];
    summaryLines.push('Total ' + (isRights ? 'Rights' : 'Rental') + ' Payments: ' + rows.length);
    summaryLines.push('Total Amount Collected: ₱ ' + C.fmtCurrency(totalPaid));
    if (isRights) {
      if (balance.opening_rights_paid != null) summaryLines.push('Opening Rights Paid: ₱ ' + C.fmtCurrency(balance.opening_rights_paid));
      if (balance.rights != null) summaryLines.push('Current Rights Balance: ₱ ' + C.fmtCurrency(balance.rights));
      if (balance.total_rights_paid != null) summaryLines.push('Total Rights Paid (incl. opening): ₱ ' + C.fmtCurrency(balance.total_rights_paid));
    } else {
      if (balance.opening_rental_paid != null) summaryLines.push('Opening Rental Paid: ₱ ' + C.fmtCurrency(balance.opening_rental_paid));
      if (balance.rental != null) summaryLines.push('Total Rental Collected: ₱ ' + C.fmtCurrency(balance.rental));
    }

    var html =
      '<div class="page">' +
      C.buildAssessmentHeaderHTML(settings, apiBase) +
      '<div class="title-block">' +
      '<h1>' + C.esc(title) + '</h1>' +
      '<div class="subtitle">' + C.esc(subtitle) + '</div>' +
      '</div>' +
      '<table class="meta-grid">' +
      '<tr>' +
      '<td class="label">Lessee:</td><td class="value">' + C.esc(contract.lessee_name || '—') + '</td>' +
      '<td class="label">Property:</td><td class="value">' + C.esc(contract.property_name || '—') + '</td>' +
      '</tr>' +
      '<tr>' +
      '<td class="label">Contact:</td><td class="value">' + C.esc(contract.lessee_contact || '—') + '</td>' +
      '<td class="label">Property Code:</td><td class="value">' + C.esc(contract.property_code || '—') + '</td>' +
      '</tr>' +
      '<tr>' +
      '<td class="label">Unit / Stall:</td><td class="value">' + C.esc(formatUnits(contract.property_units)) + '</td>' +
      '<td class="label">Contract Status:</td><td class="value">' + C.esc((contract.status || '—').toString().toUpperCase()) + '</td>' +
      '</tr>' +
      '<tr>' +
      '<td class="label">Effective:</td><td class="value">' + C.esc(effective) + '</td>' +
      '<td class="label">Termination:</td><td class="value">' + C.esc(termination) + '</td>' +
      '</tr>' +
      '<tr>' +
      '<td class="label">Contract ID:</td><td class="value">#' + C.esc(String(contract.id || contractId)) + '</td>' +
      '<td class="label">Generated:</td><td class="value">' + C.esc(issuedAt) + '</td>' +
      '</tr>' +
      '</table>' +
      tableHtml +
      '<div class="summary-box"><strong>Summary</strong><br>' + summaryLines.map(C.esc).join('<br>') + '</div>' +
      C.buildSignatoryHTML(settings, userName, apiBase) +
      '<div class="page-footer">' + C.buildFooterHTML(userName, issuedAt) + '</div>' +
      '</div>';

    document.getElementById('loading').classList.add('hidden');
    document.getElementById('error').classList.add('hidden');
    var content = document.getElementById('report-content');
    content.innerHTML = html;
    content.classList.remove('hidden');

    var pages = content.querySelectorAll('.page');
    pages.forEach(function (page, idx) {
      var num = page.querySelector('.page-number');
      var tot = page.querySelector('.total-pages');
      if (num) num.textContent = String(idx + 1);
      if (tot) tot.textContent = String(pages.length);
    });
  }
})();
</script>
</body>
</html>
