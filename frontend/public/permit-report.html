<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
<meta charset="utf-8"/>
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap');
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    margin: 0;
    padding: 0;
    background-color: #f5f5f5;
    font-family: 'Cambria', 'Noto Serif', 'Georgia', serif;
  }
  #report-container {
    max-width: 8.5in;
    margin: 20px auto;
    background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .loading {
    padding: 40px;
    text-align: center;
    font-size: 18px;
    color: #666;
  }
  .error {
    padding: 20px;
    background-color: #fff3cd;
    border: 1px solid #ffc107;
    border-radius: 4px;
    color: #856404;
    margin: 20px;
  }
  .controls {
    padding: 15px;
    background-color: #f8f9fa;
    border-bottom: 1px solid #dee2e6;
    text-align: right;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .btn {
    padding: 8px 16px;
    margin-left: 5px;
    background-color: #007bff;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
  }
  .btn:hover {
    background-color: #0056b3;
  }
  .btn:disabled {
    background-color: #6c757d;
    cursor: not-allowed;
  }
  .btn-print {
    background-color: #28a745;
  }
  .btn-print:hover {
    background-color: #1e7e34;
  }
  .btn-pdf {
    background-color: #dc3545;
  }
  .btn-pdf:hover {
    background-color: #c82333;
  }
  
  /* Report PDF Button */
  .report-pdf-btn {
    padding: 8px 16px;
    margin-left: 5px;
    background-color: #6366f1;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
  }
  
  .report-pdf-btn:hover:not(:disabled) {
    background-color: #4f46e5;
  }
  
  .report-pdf-btn:disabled {
    background-color: #ccc;
    cursor: not-allowed;
  }
  
  .report-error {
    padding: 12px;
    background-color: #fee;
    border: 1px solid #fcc;
    border-radius: 4px;
    color: #c33;
    margin: 10px 15px;
    font-size: 13px;
    display: none;
  }
  
  .report-error.show {
    display: block;
  }
  
  /* Page container for proper sizing — fixed height so footer is always at the bottom */
  .page {
    width: 8.5in;
    height: 13in;
    padding: 0.5in;
    padding-bottom: 0.75in; /* leave room for footer */
    margin: 0 auto 20px auto;
    background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    position: relative;
    page-break-after: always;
    box-sizing: border-box;
    overflow: hidden;
  }
  
  .page:last-child {
    page-break-after: avoid;
  }
  
  .page-content {
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  
  .page-footer {
    position: absolute;
    bottom: 0.35in;
    left: 0.5in;
    right: 0.5in;
    padding-top: 6px;
    border-top: 1px solid #ccc;
    text-align: center;
    font-size: 8px;
    color: #666;
  }
  
  .hidden {
    display: none;
  }
  
  /* Table styles for permit activities */
  .permit-activities-table {
    width: 100%;
    border-collapse: collapse;
    margin: 10px 0;
    font-size: 14px;
  }
  .permit-activities-table th,
  .permit-activities-table td {
    border: 1px solid #333;
    padding: 8px 12px;
    text-align: left;
  }
  .permit-activities-table th {
    background-color: #f0f0f0;
    font-weight: bold;
  }
  .permit-activities-table td.qty {
    text-align: center;
    width: 80px;
  }
  
  /* Page break utilities */
  .page-break-before {
    page-break-before: always;
  }
  .page-break-after {
    page-break-after: always;
  }
  .avoid-break {
    page-break-inside: avoid;
  }
  
  /* Continuation header for multi-page */
  .continuation-header {
    text-align: center;
    margin-bottom: 20px;
    padding-bottom: 10px;
    border-bottom: 1px solid #ccc;
  }
  .continuation-header h3 {
    font-size: 14px;
    color: #666;
  }
  
  @page {
    size: 8.5in 13in portrait;
    margin: 0;
  }
  
  @media print {
    body {
      background: white;
      margin: 0;
      padding: 0;
    }
    #report-container {
      box-shadow: none;
      margin: 0;
      max-width: 100%;
    }
    .controls {
      display: none !important;
    }
    .page {
      box-shadow: none;
      margin: 0;
      width: 8.5in;
      height: 13in;
      page-break-after: always;
      overflow: hidden;
    }
    .page:last-child {
      page-break-after: avoid;
    }
  }
</style>
<title>Generated Permit Report</title>
</head>
<body>
<div id="report-container">
  <div class="controls">
    <button class="btn btn-print" onclick="printReport()">🖨️ Print</button>
    <button class="report-pdf-btn" id="reportPdfBtn" onclick="generateReportPDF()">📄 Download PDF</button>
    <div id="reportError" class="report-error"></div>
  </div>
  
  <div id="loading" class="loading">
    <p>Loading permit report...</p>
  </div>
  
  <div id="error" class="error hidden"></div>
  
  <div id="report-content" class="hidden"></div>
</div>

<script src="js/modal-dialog.js"></script>
<script>
// Get application ID from URL parameters
const urlParams = new URLSearchParams(window.location.search);
const applicationId = urlParams.get('id') || urlParams.get('applicationId');
const authToken = urlParams.get('token') || localStorage.getItem('token') || '';

// Determine API base URL
let apiBaseUrl = '';
if (typeof window !== 'undefined') {
  if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
    apiBaseUrl = 'http://localhost:5000';
  } else {
    // Handle different port mappings (frontend:6070 -> backend:5040, frontend:3000 -> backend:5000)
    const origin = window.location.origin;
    if (origin.includes(':6070')) {
      apiBaseUrl = origin.replace(':6070', ':5040');
    } else if (origin.includes(':3000')) {
      apiBaseUrl = origin.replace(':3000', ':5000');
    } else {
      // Default: assume backend is on port 5000
      apiBaseUrl = origin.replace(/:\d+$/, ':5000');
    }
  }
}

console.log('App ID:', applicationId);
console.log('API Base URL:', apiBaseUrl);
console.log('Auth Token:', authToken ? 'Present' : 'Missing');

document.addEventListener('DOMContentLoaded', function() {
  if (!applicationId) {
    showError('No application ID provided. Please pass ?id=<applicationId> in the URL.');
    return;
  }
  
  fetchPermitReport();
});

async function fetchPermitReport() {
  try {
    const applicationUrl = `${apiBaseUrl}/api/applications/${applicationId}`;
    const assessmentUrl = `${apiBaseUrl}/api/applications/${applicationId}/assessment-record`;
    const settingsUrl = `${apiBaseUrl}/api/settings`;
    
    const headers = {
      'Content-Type': 'application/json'
    };
    
    if (authToken) {
      headers['Authorization'] = `Bearer ${authToken}`;
    }
    
    // First, fetch application data (required)
    console.log('\n========== FETCH APPLICATION DATA ==========');
    console.log('Fetching application from:', applicationUrl);
    
    const applicationResponse = await fetch(applicationUrl, {
      method: 'GET',
      headers: headers,
      credentials: 'include'
    });
    
    if (!applicationResponse.ok) {
      if (applicationResponse.status === 401) {
        throw new Error('Unauthorized. Please login again.');
      }
      if (applicationResponse.status === 404) {
        throw new Error('Application not found.');
      }
      throw new Error(`HTTP Error: ${applicationResponse.status} ${applicationResponse.statusText}`);
    }
    
    const applicationData = await applicationResponse.json();
    console.log('✅ Application data loaded successfully');
    console.log('Full applicationData:', applicationData);
    console.log('  - application_id:', applicationData.application_id);
    console.log('  - permit_type:', applicationData.permit_type);
    console.log('  - permit_type_id:', applicationData.permit_type_id);
    console.log('  - entity_id:', applicationData.entity_id);
    console.log('  - entity_name:', applicationData.entity_name);
    console.log('  - parameters:', applicationData.parameters);
    console.log('============================================\n');
    
    // Fetch assessment data (optional - may not exist for all applications)
    let assessmentData = {};
    try {
      console.log('Fetching assessment from:', assessmentUrl);
      
      const assessmentResponse = await fetch(assessmentUrl, {
        method: 'GET',
        headers: headers,
        credentials: 'include'
      });
      
      if (assessmentResponse.ok) {
        assessmentData = await assessmentResponse.json();
        console.log('✅ Assessment data loaded:', assessmentData);
      } else {
        console.warn('⚠️ Assessment record not found, using application data only');
        // Create assessment data from application data
        assessmentData = {
          business_name: applicationData.entity_name || 'N/A',
          address: applicationData.parameters?.find(p => p.param_name.toLowerCase().includes('address'))?.param_value || 'N/A',
          app_type: applicationData.permit_type,
          fees: applicationData.assessed_fees || []
        };
      }
    } catch (assessError) {
      console.warn('⚠️ Could not fetch assessment data:', assessError);
      // Create assessment data from application data
      assessmentData = {
        business_name: applicationData.entity_name || 'N/A',
        address: applicationData.parameters?.find(p => p.param_name.toLowerCase().includes('address'))?.param_value || 'N/A',
        app_type: applicationData.permit_type,
        fees: applicationData.assessed_fees || []
      };
    }
    
    // Fetch permit type to get attribute details
    let permitTypeData = {};
    console.log('\n========== CHECKING PERMIT TYPE ID ==========');
    console.log('applicationData:', applicationData);
    console.log('applicationData.permit_type_id:', applicationData.permit_type_id);
    console.log('applicationData.permit_type:', applicationData.permit_type);
    console.log('============================================\n');
    
    if (applicationData.permit_type_id) {
      try {
        const permitTypeUrl = `${apiBaseUrl}/api/permit-types/${applicationData.permit_type_id}`;
        console.log('\n========== FETCH PERMIT TYPE ==========');
        console.log('Fetching permit type from:', permitTypeUrl);
        console.log('  - permit_type_id:', applicationData.permit_type_id);
        
        const permitTypeResponse = await fetch(permitTypeUrl, {
          method: 'GET',
          headers: headers,
          credentials: 'include'
        });
        if (permitTypeResponse.ok) {
          permitTypeData = await permitTypeResponse.json();
          console.log('✅ Permit type data loaded successfully');
          console.log('Full permitTypeData:', permitTypeData);
          console.log('  - permit_type_id:', permitTypeData.permit_type_id);
          console.log('  - permit_type_name:', permitTypeData.permit_type_name);
          console.log('  - description (from Permit_Types table):', permitTypeData.description);
          console.log('  - attribute_id:', permitTypeData.attribute_id);
          console.log('  - attribute_name:', permitTypeData.attribute_name);
          console.log('  - attribute_description (from Attributes table):', permitTypeData.attribute_description);
          console.log('=====================================\n');
        } else {
          console.error('❌ Permit type fetch failed with status:', permitTypeResponse.status);
          const errorText = await permitTypeResponse.text();
          console.error('Error response:', errorText);
        }
      } catch (permitError) {
        console.error('❌ Could not fetch permit type data:', permitError);
      }
    } else {
      console.error('❌ No permit_type_id found in applicationData');
      console.log('Available application data fields:', Object.keys(applicationData));
    }
    
    // Fetch settings
    let settings = {};
    try {
      const settingsResponse = await fetch(settingsUrl, {
        method: 'GET',
        headers: headers,
        credentials: 'include'
      });
      if (settingsResponse.ok) {
        settings = await settingsResponse.json();
        console.log('✅ Settings loaded:', settings);
      }
    } catch (settingsError) {
      console.warn('Could not fetch settings, using defaults:', settingsError);
    }
    
    // Fetch payment data
    let paymentData = {};
    try {
      const paymentUrl = `${apiBaseUrl}/api/applications/${applicationId}/payment`;
      console.log('Fetching payment from:', paymentUrl);
      
      const paymentResponse = await fetch(paymentUrl, {
        method: 'GET',
        headers: headers,
        credentials: 'include'
      });
      if (paymentResponse.ok) {
        const payments = await paymentResponse.json();
        if (payments && payments.length > 0) {
          paymentData = payments[0]; // Get the first/latest payment
          console.log('✅ Payment data loaded:', paymentData);
        }
      } else {
        console.warn('Payment fetch returned status:', paymentResponse.status);
      }
    } catch (paymentError) {
      console.warn('Could not fetch payment data:', paymentError);
    }
    
    // Get assessed fees directly from the application (assessed_fees table)
    const assessmentFees = applicationData.assessed_fees || assessmentData.fees || [];
    console.log('✅ Assessment fees:', assessmentFees);

    // Fetch current user info for footer
    let currentUserName = 'PAMS';
    try {
      const meResponse = await fetch(`${apiBaseUrl}/api/auth/me`, {
        method: 'GET',
        headers: headers,
        credentials: 'include'
      });
      if (meResponse.ok) {
        const meData = await meResponse.json();
        if (meData.full_name) currentUserName = meData.full_name;
      }
    } catch (meError) {
      console.warn('Could not fetch current user info:', meError);
    }
    
    renderReport(assessmentData, settings, applicationData, permitTypeData, paymentData, assessmentFees, currentUserName);
  } catch (error) {
    console.error('Error fetching permit data:', error);
    showError(`Failed to load permit report: ${error.message}`);
  }
}

function renderReport(appData, settings = {}, applicationData = {}, permitTypeData = {}, paymentData = {}, assessmentFees = [], currentUserName = 'PAMS') {
  console.log('\n========== RENDER REPORT ==========');
  console.log('Input parameters:');
  console.log('  - appData:', appData);
  console.log('  - settings:', settings);
  console.log('  - applicationData:', applicationData);
  console.log('  - permitTypeData:', permitTypeData);
  console.log('  - paymentData:', paymentData);
  console.log('  - assessmentFees:', assessmentFees);
  
  const reportHTML = generateReportHTML(appData, settings, applicationData, permitTypeData, paymentData, assessmentFees, currentUserName);
  
  document.getElementById('report-content').innerHTML = reportHTML;
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('report-content').classList.remove('hidden');
  
  // Auto-size permit title to fit on one line
  setTimeout(() => {
    adjustPermitTitleSize();
    paginateContent();
  }, 150);
  
  console.log('===================================\n');
}

/**
 * Automatically paginate content if page 1 overflows.
 * Moves the approval section to a new page 2.
 */
function paginateContent() {
  // Remove any previously created pages (in case this is called again)
  document.querySelectorAll('.page:not(#page-1)').forEach(p => p.remove());

  const page = document.getElementById('page-1');
  if (!page) return;

  // scrollHeight > clientHeight means content is clipped
  if (page.scrollHeight <= page.clientHeight) return;

  const pageContent = page.querySelector('.page-content');
  if (!pageContent) return;

  // Find the approval section (contains "APPROVED BY")
  const approvalDiv = Array.from(pageContent.children).find(
    el => el.innerHTML && el.innerHTML.includes('APPROVED BY')
  );
  if (!approvalDiv) return;

  // Capture before removing
  const approvalOuterHTML = approvalDiv.outerHTML;
  const oldFooter = page.querySelector('.page-footer');
  const footerInnerHTML = oldFooter ? oldFooter.innerHTML : '';

  // Remove approval section from page 1
  approvalDiv.remove();

  // Insert page 2 after page 1
  const page2Html = `
    <div class="page" id="page-2">
      <div class="page-content">
        <div class="continuation-header">
          <h3>— Continuation —</h3>
        </div>
        ${approvalOuterHTML}
      </div>
      <div class="page-footer">${footerInnerHTML}</div>
    </div>
  `;
  page.insertAdjacentHTML('afterend', page2Html);

  // Recalculate page numbers
  updatePageNumbers();
}

// Function to adjust permit title font size to fit on one line
function adjustPermitTitleSize() {
  const titleElement = document.getElementById('permit-title');
  if (!titleElement) return;
  
  const container = titleElement.parentElement;
  const maxWidth = container.offsetWidth - 80; // Account for margins
  
  let fontSize = 70; // Start with max font size (biggest in document)
  const minFontSize = 36; // Minimum font size, still bigger than other text
  
  titleElement.style.fontSize = fontSize + 'px';
  
  // Reduce font size until text fits on one line
  while (titleElement.scrollWidth > maxWidth && fontSize > minFontSize) {
    fontSize -= 2;
    titleElement.style.fontSize = fontSize + 'px';
  }
  
  console.log('Permit title font size adjusted to:', fontSize + 'px');
}

/**
 * Check if permit activities should be displayed in tabular format
 * based on the settings configuration
 * 
 * Settings format (permit_tabular_display_conditions):
 * JSON array of conditions, e.g.:
 * [
 *   { "attribute_name": "PERYA", "display_mode": "table_with_quantity" },
 *   { "attribute_name": "SPECIAL_PERMIT", "display_mode": "table_with_quantity" },
 *   { "permit_type_name": "Amusement Permit", "display_mode": "table_with_quantity" }
 * ]
 * 
 * display_mode options:
 * - "table_with_quantity": Shows fee name and quantity in a table
 * - "table_simple": Shows just fee names in a table
 * - "paragraph" (default): Shows as regular paragraph text
 */
function getPermitActivitiesDisplayMode(settings, permitTypeData, assessmentFees, applicationData) {
  // applicationData has attribute_id and attribute_name joined from assessment_rules → attributes
  // This is more reliable than permitTypeData which depends on a separate API call
  const appAttrId   = applicationData?.attribute_id   || permitTypeData?.attribute_id;
  const appAttrName = applicationData?.attribute_name || permitTypeData?.attribute_name;
  const appPermitTypeName = permitTypeData?.permit_type_name || applicationData?.permit_type;

  console.log('getPermitActivitiesDisplayMode - sources:');
  console.log('  - applicationData.attribute_id:', applicationData?.attribute_id);
  console.log('  - applicationData.attribute_name:', applicationData?.attribute_name);
  console.log('  - permitTypeData.attribute_id:', permitTypeData?.attribute_id);
  console.log('  - permitTypeData.attribute_name:', permitTypeData?.attribute_name);
  console.log('  - permit_type_name used:', appPermitTypeName);
  console.log('  - attribute_id used:', appAttrId);
  console.log('  - attribute_name used:', appAttrName);

  const conditionsStr = settings.permit_tabular_display_conditions?.value;
  
  if (conditionsStr) {
    try {
      const conditions = JSON.parse(conditionsStr);
      console.log('Parsed tabular display conditions:', conditions);
      
      for (const condition of conditions) {
        // Check by attribute_name
        if (condition.attribute_name && appAttrName &&
            appAttrName.toUpperCase() === condition.attribute_name.toUpperCase()) {
          console.log(`✅ Matched by attribute_name: "${condition.attribute_name}"`);
          return { mode: condition.display_mode || 'table_with_quantity', condition };
        }
        
        // Check by permit_type_name
        if (condition.permit_type_name && appPermitTypeName &&
            appPermitTypeName.toUpperCase() === condition.permit_type_name.toUpperCase()) {
          console.log(`✅ Matched by permit_type_name: "${condition.permit_type_name}"`);
          return { mode: condition.display_mode || 'table_with_quantity', condition };
        }
        
        // Check by attribute_id
        if (condition.attribute_id && appAttrId) {
          console.log(`Comparing attribute_id: condition="${condition.attribute_id}" vs app="${appAttrId}"`);
          if (String(appAttrId) === String(condition.attribute_id)) {
            console.log(`✅ Matched by attribute_id: "${condition.attribute_id}"`);
            return { mode: condition.display_mode || 'table_with_quantity', condition };
          }
        }
      }
      
      console.log('No matching conditions found in settings.');
    } catch (parseError) {
      console.error('Error parsing tabular display conditions:', parseError);
    }
  } else {
    console.log('No tabular display conditions configured in settings.');
  }

  console.log('No matching conditions → paragraph mode');
  return { mode: 'paragraph' };
}

/**
 * Generate HTML for permit activities based on display mode
 */
function generatePermitActivitiesHTML(displayInfo, permitActivities, assessmentFees, formattedAddress, startDateParam, endDateParam, isCustomDate = false, applicationData = {}) {
  const dateOptions = { year: 'numeric', month: 'long', day: 'numeric' };
  
  let formattedDateRange = '';
  
  // If this is a custom/N/A validity type with text date parameter, use it directly
  if (isCustomDate && typeof startDateParam === 'string') {
    formattedDateRange = startDateParam;
    console.log('generatePermitActivitiesHTML - Using custom date text:');
    console.log('  - formattedDateRange (text):', formattedDateRange);
  } else {
    // Parse dates - handle both Date objects and strings
    let startDateObj = startDateParam;
    let endDateObj = endDateParam;
    
    // Convert to Date if string
    if (typeof startDateParam === 'string' && startDateParam !== 'Invalid Date') {
      startDateObj = new Date(startDateParam);
    }
    if (typeof endDateParam === 'string' && endDateParam !== 'Invalid Date') {
      endDateObj = new Date(endDateParam);
    }
    
    // Format dates
    const startDate = (startDateObj instanceof Date && !isNaN(startDateObj)) 
      ? startDateObj.toLocaleDateString('en-US', dateOptions) 
      : (typeof startDateParam === 'string' ? startDateParam : 'N/A');
    
    const endDate = (endDateObj instanceof Date && !isNaN(endDateObj)) 
      ? endDateObj.toLocaleDateString('en-US', dateOptions) 
      : (typeof endDateParam === 'string' ? endDateParam : 'N/A');
    
    // Format date range - if start and end dates are different, show them appropriately
    formattedDateRange = `${startDate} up to ${endDate}`;
    
    // Check if dates are the same (single date permit)
    if (startDate === endDate) {
      formattedDateRange = startDate;
    }
    
    console.log('generatePermitActivitiesHTML - Date formatting:');
    console.log('  - startDateParam:', startDateParam, 'type:', typeof startDateParam);
    console.log('  - endDateParam:', endDateParam, 'type:', typeof endDateParam);
    console.log('  - startDate (formatted):', startDate);
    console.log('  - endDate (formatted):', endDate);
    console.log('  - formattedDateRange:', formattedDateRange);
  }
  
  // Check if this is a Motorcade permit
  const isMotorcade = applicationData?.attribute_name?.trim().toUpperCase() === 'MOTORCADE';
  
  if (isMotorcade) {
    // For Motorcade permits, use special format: "To conduct/engage in operating {conduct/engage_parameter} from {route_parameter} on {date} only."
    const conductParam = applicationData?.parameters?.find((p) => p.param_name === 'Conduct/engage in')?.param_value || 'Motorcade';
    const routeParam = applicationData?.parameters?.find((p) => p.param_name === 'Route')?.param_value || 'N/A';
    
    console.log('Motorcade permit detected - using special format');
    console.log('  - conductParam:', conductParam);
    console.log('  - routeParam:', routeParam);
    
    return `
      <p style="margin: 0; text-indent: 40px;">To conduct/engage in operating <strong>${conductParam}</strong> from <strong>${routeParam}</strong> on <strong>${formattedDateRange}</strong> only.</p>
    `;
  }
  
  if (displayInfo.mode === 'table_with_quantity' && assessmentFees.length > 0) {
    // Generate table with fee names and quantities
    let tableRows = assessmentFees
      .filter(fee => fee.quantity && fee.quantity > 0) // Only show fees with quantity
      .map(fee => `
        <tr>
          <td>${fee.fee_name}</td>
          <td class="qty">${fee.quantity}</td>
        </tr>
      `).join('');
    
    // If no fees with quantity, fall back to showing all fees
    if (!tableRows) {
      tableRows = assessmentFees.map(fee => `

      `).join('');
    }
    
    return `

          </tr>
        </thead>
        <tbody>
          ${tableRows}
        </tbody>
      </table>
      <p style="margin: 10px 0 0 0; text-indent: 40px;">Valid from <strong>${formattedDateRange}</strong> only.</p>
    `;
  } else if (displayInfo.mode === 'table_simple' && assessmentFees.length > 0) {
    // Generate simple table with just fee names
    const tableRows = assessmentFees.map(fee => `
      <tr>
        <td>${fee.fee_name}</td>
      </tr>
    `).join('');
    
    return `
      <p style="margin: 0; text-indent: 40px;">To conduct/engage in operating <strong>${permitActivities}</strong> at <strong>${formattedAddress}</strong>:</p>
      <table class="permit-activities-table" style="margin: 15px auto; width: 60%;">
        <thead>

          </tr>
        </thead>

          ${tableRows}
        </tbody>
      </table>

    `;
  } else {
    // Default paragraph mode
    return `
      <p style="margin: 0; text-indent: 40px;">To conduct/engage in operating <strong>${permitActivities}</strong> at <strong>${formattedAddress}</strong> on <strong>${formattedDateRange}</strong> only.</p>
    `;
  }
}

function checkAndApplyPagination() {

  console.log('Page height limit:', pageHeight, 'px');
  console.log('Content height:', contentHeight, 'px');
  
  if (contentHeight > pageHeight) {
    console.log('⚠️ Content overflows! Pagination may be needed.');
    // The CSS page-break rules will handle this during print/PDF generation
    // We just need to update page numbers
  }
  
  updatePageNumbers();
}

/**
 * Update page numbers in the document
 */
function updatePageNumbers() {
  const pages = document.querySelectorAll('.page');
  const totalPages = pages.length;
  
  pages.forEach((page, index) => {
    const pageNumEl = page.querySelector('.page-number');
    const totalPagesEl = page.querySelector('.total-pages');
    
    if (pageNumEl) pageNumEl.textContent = index + 1;
    if (totalPagesEl) totalPagesEl.textContent = totalPages;
  });
}

/**
 * Download the permit report as a PDF file
 * Uses html2pdf.js library for client-side PDF generation
 */
async function downloadPDF() {
  const pdfBtn = document.getElementById('pdf-btn');
  const originalText = pdfBtn.innerHTML;
  
  try {
    // Disable button and show loading state
    pdfBtn.disabled = true;
    pdfBtn.innerHTML = '⏳ Generating PDF...';
    
    // Get the report content
    const element = document.getElementById('report-content');
    
    if (!element || element.classList.contains('hidden')) {
      throw new Error('Report content not loaded yet');
    }
    
    // Get metadata for filename
    const meta = window.permitReportMeta || {};
    const businessName = (meta.businessName || 'Permit').replace(/[^a-zA-Z0-9]/g, '_');
    const date = new Date().toISOString().split('T')[0];
    const filename = `Permit_${businessName}_${date}.pdf`;
    
    // Configure PDF options for 8.5 x 13 inch (Legal size)
    const opt = {
      margin: [0.5, 0.5, 0.5, 0.5], // inches: top, left, bottom, right
      filename: filename,
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { 
        scale: 2,
        useCORS: true,
        allowTaint: true,
        logging: false,
        letterRendering: true
      },
      jsPDF: { 
        unit: 'in', 
        format: [8.5, 13], // Legal size
        orientation: 'portrait'
      },
      pagebreak: { 
        mode: ['avoid-all', 'css', 'legacy'],
        before: '.page-break-before',
        after: '.page-break-after',
        avoid: '.avoid-break'
      }
    };
    
    console.log('Generating PDF with options:', opt);
    
    // Generate and download the PDF
    await html2pdf().set(opt).from(element).save();
    
    console.log('✅ PDF generated successfully:', filename);
    
    // Show success message briefly
    pdfBtn.innerHTML = '✅ Downloaded!';
    setTimeout(() => {
      pdfBtn.innerHTML = originalText;
      pdfBtn.disabled = false;
    }, 2000);
    
  } catch (error) {
    console.error('❌ Error generating PDF:', error);
    modalAlert('Error generating PDF: ' + error.message);
    pdfBtn.innerHTML = originalText;
    pdfBtn.disabled = false;
  }
}

function showError(message) {
  document.getElementById('error').textContent = message;
  document.getElementById('error').classList.remove('hidden');
  document.getElementById('loading').classList.add('hidden');
}

// Generate PDF via Puppeteer (server-side)
async function generateReportPDF() {
  const reportPdfBtn = document.getElementById('reportPdfBtn');
  const reportError = document.getElementById('reportError');

  try {
    const reportContent = document.getElementById('report-content');
    if (!reportContent || reportContent.classList.contains('hidden')) {
      throw new Error('Report not loaded yet. Wait for the permit to load first.');
    }

    reportPdfBtn.disabled = true;
    reportPdfBtn.innerHTML = '⏳ Generating PDF...';
    reportError.classList.remove('show');

    // Collect all <style> blocks from the page for embedding
    const styleText = Array.from(document.querySelectorAll('style'))
      .map(s => s.innerHTML).join('\n');

    // Build a self-contained HTML document for Puppeteer
    const fullHtml = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
${styleText}
body { background: white; margin: 0; padding: 0; }
.controls { display: none !important; }
#report-container { box-shadow: none; margin: 0; max-width: 100%; }
.page { box-shadow: none; margin: 0; }
</style>
</head>
<body>
<div id="report-container">
${reportContent.innerHTML}
</div>
</body>
</html>`;

    const meta = window.permitReportMeta || {};
    const businessName = (meta.businessName || 'Permit').replace(/[^a-zA-Z0-9]/g, '_');
    const date = new Date().toISOString().split('T')[0];
    const filename = `Permit_${businessName}_${date}.pdf`;

    const response = await fetch(`${apiBaseUrl}/api/reports/generate-from-html`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        ...(authToken && { 'Authorization': `Bearer ${authToken}` })
      },
      body: JSON.stringify({ html: fullHtml, filename, pageSize: 'legal' })
    });

    if (!response.ok) {
      const err = await response.json().catch(() => ({ error: 'Server error' }));
      throw new Error(err.error || `HTTP ${response.status}`);
    }

    const blob = await response.blob();
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    window.URL.revokeObjectURL(url);

    reportPdfBtn.innerHTML = '✅ Downloaded!';
    setTimeout(() => {
      reportPdfBtn.innerHTML = '📄 Download PDF';
      reportPdfBtn.disabled = false;
    }, 2000);

  } catch (error) {
    reportError.textContent = `Error: ${error.message}`;
    reportError.classList.add('show');
    setTimeout(() => reportError.classList.remove('show'), 5000);
    reportPdfBtn.innerHTML = '📄 Download PDF';
    reportPdfBtn.disabled = false;
  }
}
