<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Enforcer Citations Report</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #f5f5f5; font-family: 'Cambria', 'Georgia', serif; }
.controls {
  padding: 12px 16px; background: #f8f9fa; border-bottom: 1px solid #dee2e6;
  text-align: right; position: sticky; top: 0; z-index: 100;
}
.btn { padding: 7px 14px; margin-left: 6px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; color: white; }
.btn-print { background: #28a745; } .btn-print:hover { background: #1e7e34; }
.btn-pdf   { background: #6366f1; } .btn-pdf:hover:not(:disabled) { background: #4f46e5; } .btn-pdf:disabled { background: #aaa; cursor: not-allowed; }
.pdf-error { display: none; margin: 6px 16px 0; padding: 7px 12px; background: #fee; border: 1px solid #fcc; border-radius: 4px; color: #c33; font-size: 12px; }
.pdf-error.show { display: block; }
.loading  { padding: 40px; text-align: center; font-size: 16px; color: #666; }
.err-msg  { margin: 20px; padding: 14px; background: #fff3cd; border: 1px solid #ffc107; border-radius: 4px; color: #856404; }
.hidden   { display: none; }
.page {
  width: 13in; height: 8.5in;
  padding: 0.5in 0.5in 0.75in 0.5in;
  margin: 0 auto 24px auto;
  background: white; box-shadow: 0 2px 10px rgba(0,0,0,.15);
  position: relative; overflow: hidden; box-sizing: border-box;
}
.page-footer {
  position: absolute; bottom: 0; left: 0.5in; right: 0.5in;
  height: 0.75in; display: flex; align-items: flex-end; padding-bottom: 0.1in;
  background: white; z-index: 2;
}
.page-footer > div {
  width: 100%; border-top: 1px solid #bbb; padding-top: 5px;
  text-align: center; font-size: 8px; color: #666;
}
.doc-header { text-align: center; margin-bottom: 10px; }
.doc-header-rule { border-bottom: 2px solid #222; margin-top: 5px; }
.report-title { text-align: center; margin-bottom: 7px; }
.report-title h2 { font-size: 14px; font-weight: bold; letter-spacing: 1.5px; text-transform: uppercase; }
.report-title .sub  { font-size: 10.5px; font-weight: bold; margin-top: 2px; }
.report-title .meta { font-size: 9px; color: #555; margin-top: 2px; }
.title-rule { border-bottom: 1px solid #ccc; margin-bottom: 8px; }
.cont-label {
  text-align: center; font-size: 9.5px; color: #555; font-style: italic;
  padding-bottom: 5px; border-bottom: 1px dashed #ccc; margin-bottom: 6px;
}
.enf-box {
  display: grid; grid-template-columns: 1fr 1fr; gap: 1px 14px;
  border: 1px solid #ccc; padding: 6px 10px; margin-bottom: 8px;
  background: #fafafa; font-size: 9.5px; line-height: 1.6;
}
.enf-box .erow { display: flex; gap: 5px; }
.enf-box .elbl { font-weight: bold; min-width: 80px; }
.citation-table { width: 100%; border-collapse: collapse; font-size: 9.5px; border: 1px solid #333; }
.citation-table th {
  border: 1px solid #333; padding: 5px 6px;
  background: #f0f0f0; font-weight: bold; text-align: center; font-size: 10px;
}
.citation-table td { border: 1px solid #333; padding: 4px 6px; vertical-align: top; }
.citation-table td.c { text-align: center; }
.citation-table td.r { text-align: right; }
.citation-table tfoot td { border: 1px solid #333; padding: 5px 6px; font-weight: bold; background: #f0f0f0; }
.summary-box {
  margin-top: 8px; padding: 6px 10px; border: 1px solid #999;
  font-size: 10px; line-height: 1.65;
}
@page { size: 13in 8.5in landscape; margin: 0; }
@media print {
  body { background: white; }
  .controls { display: none !important; }
  #wrap { max-width: none; }
  .page { box-shadow: none; margin: 0; page-break-after: always; }
  .page:last-child { page-break-after: avoid; }
}
</style>
</head>
<body>
<div id="wrap">
  <div class="controls">
    <button class="btn btn-print" onclick="window.print()">&#128424; Print</button>
    <button class="btn btn-pdf" id="pdfBtn" onclick="generatePDF()">&#128196; Download PDF</button>
    <div class="pdf-error" id="pdfError"></div>
  </div>
  <div id="loading" class="loading">Loading enforcer report&hellip;</div>
  <div id="errMsg"  class="err-msg hidden"></div>
  <div id="pages"></div>
</div>
<script>
var urlP         = new URLSearchParams(window.location.search);
var enforcerId   = urlP.get('enforcerId') || '';
var statusFilter = urlP.get('status')     || '';
var authToken    = urlP.get('token')      || localStorage.getItem('token') || '';
// Header group: 'permit' | 'assessment' | 'disco'  (default: permit)
var headerGroup  = urlP.get('header')     || 'permit';

var apiBase = '';
(function() {
  var h = window.location.hostname, o = window.location.origin;
  if (h === 'localhost' || h === '127.0.0.1') apiBase = 'http://localhost:5000';
  else if (o.indexOf(':6070') >= 0)           apiBase = o.replace(':6070', ':5040');
  else if (o.indexOf(':3000') >= 0)           apiBase = o.replace(':3000', ':5000');
  else                                         apiBase = o.replace(/:\d+$/, ':5000');
})();

// Page geometry (96 dpi)
var DPI     = 96;
var PAGE_H  = 8.5  * DPI;  //  816 px
var PAD_TOP = 0.5  * DPI;  //   48 px
var FOOT_H  = 0.75 * DPI;  //   72 px
var CONT_H  = PAGE_H - PAD_TOP - FOOT_H;  //  696 px — CSS clip boundary
var PACK_H  = CONT_H - 40;               //  656 px — conservative packing budget
var CONT_W  = (13 - 1) * DPI;            // 1152 px content width

document.addEventListener('DOMContentLoaded', loadReport);

async function loadReport() {
  try {
    if (!enforcerId) throw new Error('No enforcer ID provided.');
    var hdrs = { 'Content-Type': 'application/json' };
    if (authToken) hdrs['Authorization'] = 'Bearer ' + authToken;

    var results = await Promise.all([
      fetch(apiBase + '/api/enforcers/' + enforcerId, { headers: hdrs }),
      fetch(apiBase + '/api/enforcers/' + enforcerId + '/citations?limit=10000' +
        (statusFilter ? '&status=' + encodeURIComponent(statusFilter) : ''), { headers: hdrs })
    ]);
    if (!results[0].ok) throw new Error('Enforcer API: HTTP ' + results[0].status);
    if (!results[1].ok) throw new Error('Citations API: HTTP ' + results[1].status);

    var eData = await results[0].json();
    var cData = await results[1].json();
    var enforcer   = eData.enforcer != null ? eData.enforcer : eData;
    var citations  = cData.citations  || [];
    var statistics = cData.statistics || {};

    var settings = {};
    try { var r = await fetch(apiBase + '/api/settings', { headers: hdrs }); if (r.ok) settings = await r.json(); } catch(e) {}

    var userName = 'PAMS';
    try { var r2 = await fetch(apiBase + '/api/auth/me', { headers: hdrs }); if (r2.ok) { var d = await r2.json(); if (d.full_name) userName = d.full_name; } } catch(e) {}

    document.getElementById('loading').classList.add('hidden');
    renderReport(enforcer, citations, statistics, settings, userName);
  } catch (err) {
    console.error(err);
    document.getElementById('loading').classList.add('hidden');
    var el = document.getElementById('errMsg');
    el.textContent = 'Failed to load report: ' + err.message;
    el.classList.remove('hidden');
  }
}

function fmtDate(d) {
  if (!d) return '\u2014';
  var dt = new Date(d);
  return isNaN(dt.getTime()) ? d : dt.toLocaleDateString('en-US', { year:'numeric', month:'2-digit', day:'2-digit' });
}
function fmtCur(v) {
  var n = parseFloat(v) || 0;
  var parts = n.toFixed(2).split('.');
  return '\u20b1' + parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + parts[1];
}

var HEADER_DEFAULTS = {
  permit:     { line4: 'OFFICE OF THE MUNICIPAL MAYOR', line5: 'Tel. # 520 4141 loc. 315' },
  assessment: { line4: "MUNICIPAL TREASURER'S OFFICE", line5: '' },
  disco:      { line4: 'OFFICE OF THE MUNICIPAL MAYOR', line5: '' },
};

function buildHeader(settings) {
  var pfx = headerGroup + '_header';
  var def = HEADER_DEFAULTS[headerGroup] || HEADER_DEFAULTS.permit;
  function getUrl(u) {
    if (!u) return null;
    if (u.indexOf('http') === 0)  return u;
    if (u.indexOf('/api/') === 0) return apiBase + u;
    return u;
  }
  var logoL  = getUrl(settings[pfx + '_logo_left']  && settings[pfx + '_logo_left'].value)  || '/dalaguete-logo.png';
  var logoR  = getUrl(settings[pfx + '_logo_right'] && settings[pfx + '_logo_right'].value) || null;
  var logoH  = Math.max(20, Math.min(120, parseFloat((settings[pfx + '_logo_size']  && settings[pfx + '_logo_size'].value)  || '50') || 50));
  var fs     = Math.max(7,  Math.min(20,  parseFloat((settings[pfx + '_font_size']  && settings[pfx + '_font_size'].value)  || '11') || 11));
  var fs4    = Math.round(fs * 1.45);
  var L1 = (settings[pfx + '_line_1'] && settings[pfx + '_line_1'].value) || 'REPUBLIC OF THE PHILIPPINES';
  var L2 = (settings[pfx + '_line_2'] && settings[pfx + '_line_2'].value) || 'MUNICIPALITY OF DALAGUETE';
  var L3 = (settings[pfx + '_line_3'] && settings[pfx + '_line_3'].value) || 'PROVINCE OF CEBU';
  var L4 = (settings[pfx + '_line_4'] && settings[pfx + '_line_4'].value != null) ? settings[pfx + '_line_4'].value : def.line4;
  var L5 = (settings[pfx + '_line_5'] && settings[pfx + '_line_5'].value != null) ? settings[pfx + '_line_5'].value : def.line5;
  return '<div class="doc-header">' +
    '<div style="display:flex;justify-content:center;align-items:center;gap:14px;margin-bottom:4px;">' +
      '<img src="' + logoL + '" alt="" style="height:' + logoH + 'px;width:auto;object-fit:contain;" onerror="this.style.display=\'none\'">' +
      '<div style="text-align:center;line-height:1.25;">' +
        (L1 ? '<div style="font-size:' + fs  + 'px;font-weight:bold;">' + L1 + '</div>' : '') +
        (L2 ? '<div style="font-size:' + fs  + 'px;font-weight:bold;">' + L2 + '</div>' : '') +
        (L3 ? '<div style="font-size:' + fs  + 'px;font-weight:bold;">' + L3 + '</div>' : '') +
        (L4 ? '<div style="font-size:' + fs4 + 'px;font-weight:bold;margin-top:2px;">' + L4 + '</div>' : '') +
        (L5 ? '<div style="font-size:' + fs  + 'px;font-weight:bold;margin-top:1px;">' + L5 + '</div>' : '') +
      '</div>' +
      (logoR ? '<img src="' + logoR + '" alt="" style="height:' + logoH + 'px;width:auto;object-fit:contain;" onerror="this.style.display=\'none\'">' : '') +
    '</div>' +
    '<div class="doc-header-rule"></div>' +
  '</div>';
}

function measure(html) {
  var d = document.createElement('div');
  d.style.cssText = 'position:fixed;top:-99999px;left:-99999px;width:' + CONT_W + 'px;' +
    'visibility:hidden;font-family:Cambria,Georgia,serif;font-size:9.5px;box-sizing:border-box;';
  d.innerHTML = html;
  document.body.appendChild(d);
  var h = d.offsetHeight;
  document.body.removeChild(d);
  return h;
}

var THEAD_HTML =
  '<thead><tr>' +
  '<th style="width:8%;">Ticket No.</th>' +
  '<th style="width:7%;">Date</th>' +
  '<th style="width:12%;">Driver</th>' +
  '<th style="width:11%;">Address</th>' +
  '<th style="width:7%;">Plate</th>' +
  '<th style="width:12%;">Violation Location</th>' +
  '<th style="width:7%;">Violation Time</th>' +
  '<th style="width:24%;">Violations</th>' +
  '<th style="width:12%;">Amount</th>' +
  '</tr></thead>';

function renderReport(enforcer, citations, statistics, settings, userName) {
  var now       = new Date();
  var issuedAt  = now.toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric', hour:'2-digit', minute:'2-digit' });
  var filterLbl = statusFilter ? 'Status: ' + statusFilter : 'All Statuses';

  var totalFines  = statistics.total_fines      != null ? statistics.total_fines      : citations.reduce(function(s,c){ return s + (parseFloat(c.fine_amount)||0); }, 0);
  var totalIssued = statistics.total_issued     != null ? statistics.total_issued     : citations.length;
  var paidCnt     = statistics.paid_count       != null ? statistics.paid_count       : 0;
  var pendCnt     = statistics.pending_count    != null ? statistics.pending_count    : 0;
  var instCnt     = statistics.installment_count!= null ? statistics.installment_count: 0;

  var headerHTML = buildHeader(settings);

  var page1TopHTML =
    '<div class="report-title">' +
      '<h2>Enforcer Citations Report</h2>' +
      '<div class="sub">' + (enforcer.full_name || '') + ' &nbsp;(Badge #' + (enforcer.badge_number || '\u2014') + ')</div>' +
      '<div class="meta">' + filterLbl + ' &nbsp;|&nbsp; As of: ' + issuedAt + '</div>' +
    '</div>' +
    '<div class="title-rule"></div>' +
    '<div class="enf-box">' +
      '<div class="erow"><span class="elbl">Name:</span><span>'       + (enforcer.full_name    || '\u2014') + '</span></div>' +
      '<div class="erow"><span class="elbl">Badge #:</span><span>'    + (enforcer.badge_number || '\u2014') + '</span></div>' +
      '<div class="erow"><span class="elbl">Position:</span><span>'   + (enforcer.position     || '\u2014') + '</span></div>' +
      '<div class="erow"><span class="elbl">Department:</span><span>' + (enforcer.department   || '\u2014') + '</span></div>' +
      '<div class="erow"><span class="elbl">Station:</span><span>'    + (enforcer.station      || '\u2014') + '</span></div>' +
      '<div class="erow"><span class="elbl">Status:</span><span>'     + (enforcer.status       || '\u2014') + '</span></div>' +
    '</div>';

  var contLabelHTML =
    '<div class="cont-label">ENFORCER CITATIONS REPORT \u2014 ' +
    (enforcer.full_name || '') + ' (Badge #' + (enforcer.badge_number || '') + ') \u2014 ' +
    filterLbl + ' \u2014 Continuation</div>';

  var summaryHTML =
    '<div class="summary-box">' +
      '<strong>Total Citations:</strong> ' + totalIssued + ' &nbsp;&nbsp; ' +
      '<strong>Paid:</strong> ' + paidCnt + ' &nbsp;&nbsp; ' +
      '<strong>Pending:</strong> ' + pendCnt + ' &nbsp;&nbsp; ' +
      '<strong>Installment / Partial:</strong> ' + instCnt + ' &nbsp;&nbsp; ' +
      '<strong>Total Fines:</strong> ' + fmtCur(totalFines) +
    '</div>';

  var tfootHTML =
    '<tfoot><tr>' +
      '<td colspan="8" style="text-align:right;font-weight:bold;">TOTAL FINES:</td>' +
      '<td class="r" style="font-weight:bold;">' + fmtCur(totalFines) + '</td>' +
    '</tr></tfoot>';

  // Measure the entire fixed top section as one unit for accuracy
  var THEAD_TABLE = '<table class="citation-table">' + THEAD_HTML + '</table>';
  var page1FixedH = measure(headerHTML + page1TopHTML + THEAD_TABLE);
  var contFixedH  = measure(headerHTML + contLabelHTML + THEAD_TABLE);
  var sumH        = measure(summaryHTML);

  var rowArea1 = PACK_H - page1FixedH;
  var rowAreaN = PACK_H - contFixedH;

  // Measure each row
  var rowItems = citations.map(function(c) {
    var viols = Array.isArray(c.violations) ? c.violations.join('; ') : (c.violations || '\u2014');
    var html =
      '<tr>' +
        '<td class="c">' + (c.ticket_number       || '\u2014') + '</td>' +
        '<td class="c">' + fmtDate(c.violation_date) + '</td>' +
        '<td>'           + (c.driver_name          || '\u2014') + '</td>' +
        '<td>'           + (c.driver_address       || '\u2014') + '</td>' +
        '<td>'           + (c.plate_number         || '\u2014') + '</td>' +
        '<td>'           + (c.violation_location   || '\u2014') + '</td>' +
        '<td class="c">' + (c.violation_time       || '\u2014') + '</td>' +
        '<td>'           + viols                                + '</td>' +
        '<td class="r">' + fmtCur(c.fine_amount)               + '</td>' +
      '</tr>';
    return { html: html, h: measure('<table class="citation-table"><tbody>' + html + '</tbody></table>') };
  });

  // Pack rows into pages
  var pages = [], curRows = [], curH = 0, pgIdx = 0;
  for (var i = 0; i < rowItems.length; i++) {
    var row    = rowItems[i];
    var isLast = (i === rowItems.length - 1);
    var maxH   = Math.max(pgIdx === 0 ? rowArea1 : rowAreaN, row.h);
    var needed = curH + row.h + (isLast ? sumH : 0);
    if (needed > maxH && curRows.length > 0) {
      pages.push(curRows);
      curRows = []; curH = 0; pgIdx++;
      maxH = Math.max(rowAreaN, row.h);
    }
    curRows.push(row.html);
    curH += row.h;
  }
  pages.push(curRows);

  var totalPages = pages.length;
  var pagesHTML  = '';

  for (var p = 0; p < totalPages; p++) {
    var rows     = pages[p];
    var isFirstP = (p === 0);
    var isLastP  = (p === totalPages - 1);
    var topHTML  = isFirstP ? headerHTML + page1TopHTML : headerHTML + contLabelHTML;
    var bodyRows = rows.length > 0
      ? rows.join('')
      : '<tr><td colspan="9" style="text-align:center;padding:16px;color:#888;">No citations found.</td></tr>';

    pagesHTML +=
      '<div class="page">' +
        '<div style="height:' + (CONT_H - 2) + 'px;overflow:hidden;">' +
          topHTML +
          '<table class="citation-table">' +
            THEAD_HTML + '<tbody>' + bodyRows + '</tbody>' + (isLastP ? tfootHTML : '') +
          '</table>' +
          (isLastP ? summaryHTML : '') +
        '</div>' +
        '<div class="page-footer"><div>' +
          'Generated by: ' + userName + ' &nbsp;|&nbsp; Permit and Assessment Management System' +
          ' &nbsp;|&nbsp; ' + issuedAt +
          ' &nbsp;|&nbsp; Page ' + (p + 1) + ' of ' + totalPages +
        '</div></div>' +
      '</div>';
  }

  document.getElementById('pages').innerHTML = pagesHTML;
}

async function generatePDF() {
  var btn    = document.getElementById('pdfBtn');
  var errDiv = document.getElementById('pdfError');
  var orig   = btn.innerHTML;
  try {
    var pagesDiv = document.getElementById('pages');
    if (!pagesDiv || !pagesDiv.innerHTML.trim()) throw new Error('Report not loaded yet.');
    btn.disabled = true; btn.innerHTML = '&#9203; Generating PDF&hellip;';
    errDiv.classList.remove('show');

    var styleText = Array.from(document.querySelectorAll('style')).map(function(s) { return s.innerHTML; }).join('\n');
    var fullHtml =
      '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><style>' + styleText +
      '\nbody{background:white;margin:0;padding:0;}' +
      '\n.controls{display:none!important;}' +
      '\n.page{box-shadow:none;margin:0;}' +
      '</style></head><body><div id="wrap"><div id="pages">' + pagesDiv.innerHTML + '</div></div></body></html>';

    var date  = new Date().toISOString().split('T')[0];
    var label = statusFilter ? '_' + statusFilter : '';
    var fname = 'enforcer_report' + label + '_' + date + '.pdf';

    var hdrs = { 'Content-Type': 'application/json' };
    if (authToken) hdrs['Authorization'] = 'Bearer ' + authToken;

    var res = await fetch(apiBase + '/api/reports/generate-pdf', {
      method: 'POST', headers: hdrs,
      body: JSON.stringify({ html: fullHtml, filename: fname, width: '13in', height: '8.5in', landscape: true })
    });
    if (!res.ok) throw new Error('Server returned ' + res.status);
    var blob = await res.blob();
    var url  = URL.createObjectURL(blob);
    var a    = document.createElement('a');
    a.href = url; a.download = fname; a.click();
    URL.revokeObjectURL(url);
  } catch (err) {
    errDiv.textContent = 'PDF error: ' + err.message;
    errDiv.classList.add('show');
  } finally {
    btn.disabled = false; btn.innerHTML = orig;
  }
}
</script>
</body>
</html>
