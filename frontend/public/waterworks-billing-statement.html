<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Waterworks Billing Statement</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Times New Roman", Times, Georgia, serif;
    background: #e8ecf1;
    color: #111;
  }
  .controls {
    font-family: system-ui, -apple-system, Segoe UI, Arial, sans-serif;
    padding: 10px 16px;
    background: #f8fafc;
    border-bottom: 1px solid #dbe2ea;
    display: flex;
    align-items: center;
    gap: 8px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .btn {
    padding: 7px 14px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    color: #fff;
    background: #1f6b4a;
  }
  .btn:hover { background: #18573c; }
  .btn:disabled { background: #94a3b8; cursor: not-allowed; }
  #loadStatus { font-size: 13px; color: #475569; }
  #bill-wrap { display: flex; justify-content: center; padding: 24px 12px 48px; }
  #bill-wrap.hidden { display: none; }

  .billing-doc {
    width: 8.5in;
    background: #fff;
    border: 1px solid #c5cdd8;
    box-shadow: 0 8px 28px rgba(15, 23, 42, 0.08);
    padding: 0.5in 0.55in 0.48in;
    font-size: 11pt;
    line-height: 1.3;
    color: #0f172a;
  }
  .doc-header {
    display: grid;
    grid-template-columns: 72px 1fr 72px;
    align-items: center;
    column-gap: 12px;
    margin-bottom: 14px;
    line-height: 1.4;
    text-align: center;
  }
  .doc-header .logo-left {
    width: 72px;
    height: 72px;
    object-fit: contain;
    display: block;
  }
  .doc-header .logo-spacer { width: 72px; height: 72px; }
  .doc-header .header-text { text-align: center; }
  .doc-header .muni {
    font-size: 15pt;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .doc-header .office {
    font-size: 10.5pt;
    font-weight: 700;
    letter-spacing: 0.03em;
    margin-top: 2px;
    text-transform: uppercase;
  }
  .doc-header .dept {
    font-size: 12.5pt;
    font-weight: 700;
    margin-top: 6px;
    padding-bottom: 8px;
    border-bottom: 2.5px double #0f172a;
    display: inline-block;
    min-width: 78%;
  }
  table.bill {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    border: 1.5px solid #0f172a;
  }
  table.bill td {
    border: 1px solid #1e293b;
    padding: 6px 8px;
    vertical-align: middle;
  }
  table.bill .lbl {
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    font-size: 10pt;
  }
  table.bill .center { text-align: center; }
  table.bill .subhead {
    font-size: 8.5pt;
    font-weight: 700;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #334155;
    margin-bottom: 2px;
  }
  table.bill .section-title {
    background: #f1f5f9;
    font-size: 9.5pt;
    letter-spacing: 0.05em;
    padding-top: 5px;
    padding-bottom: 5px;
  }
  table.bill .field-label { width: 18%; background: #f8fafc; white-space: nowrap; }
  table.bill .field-value { font-size: 11.5pt; font-weight: 600; }
  table.bill .meter-no-cell { background: #f8fafc; line-height: 1.35; }
  table.bill .meter-no-value { font-weight: 600; font-size: 12pt; margin-top: 6px; }
  table.bill .collection-cell { background: #f8fafc; }
  table.bill .collection-label { font-weight: 700; text-transform: none; letter-spacing: 0; }
  table.bill .collection-value { float: right; font-weight: 700; font-size: 11.5pt; }
  table.bill .date-value { font-weight: 600; font-variant-numeric: tabular-nums; font-size: 11pt; }
  table.bill .amount-cell,
  table.bill .reading-cell {
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    font-size: 11.5pt;
    padding-top: 10px;
    padding-bottom: 10px;
  }
  table.bill .total-cell { font-weight: 700; font-size: 12.5pt; background: #f8fafc; }
  table.bill .col-head {
    background: #f1f5f9;
    font-size: 9pt;
    line-height: 1.25;
    letter-spacing: 0.03em;
  }
  .rate-cell {
    font-size: 10pt;
    line-height: 1.55;
    vertical-align: top !important;
    padding: 10px 10px 12px !important;
  }
  .rate-title {
    display: block;
    font-weight: 700;
    letter-spacing: 0.04em;
    margin-bottom: 6px;
    padding-bottom: 4px;
    border-bottom: 1px solid #cbd5e1;
  }
  .rate-line {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-variant-numeric: tabular-nums;
    padding: 1px 0;
  }
  .rate-line .amt { font-weight: 600; white-space: nowrap; }
  .note-cell { vertical-align: top !important; padding: 10px 12px 14px !important; }
  .note-line { font-size: 10.5pt; margin-bottom: 8px; }
  .sig-block { text-align: center; padding-top: 42px; line-height: 1.35; }
  .sig-name {
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-size: 11.5pt;
    border-top: 1px solid #0f172a;
    display: inline-block;
    min-width: 55%;
    padding-top: 4px;
    margin-top: 28px;
  }
  .sig-title {
    font-size: 9.5pt;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: #334155;
    margin-top: 2px;
  }
  .no-bill-msg {
    margin-top: 12px;
    text-align: center;
    font-family: system-ui, Arial, sans-serif;
    font-size: 10pt;
    color: #64748b;
  }

  @media print {
    .controls { display: none !important; }
    body { background: #fff; }
    #bill-wrap { padding: 0; }
    .billing-doc {
      border: none;
      box-shadow: none;
      width: 100%;
      padding: 0.2in 0.3in;
    }
    table.bill .section-title,
    table.bill .field-label,
    table.bill .meter-no-cell,
    table.bill .collection-cell,
    table.bill .col-head,
    table.bill .total-cell {
      background: #f3f3f3 !important;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
  }
</style>
</head>
<body>
<div class="controls">
  <span id="loadStatus">Loading...</span>
  <div style="flex:1"></div>
  <button class="btn" id="btnPrint" disabled onclick="window.print()">Print</button>
</div>
<div id="bill-wrap" class="hidden"></div>

<script src="/js/waterworks-billing-common.js"></script>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var accountId = params.get('account_id');
  var month = parseInt(params.get('month')) || (new Date().getMonth() + 1);
  var year = parseInt(params.get('year')) || new Date().getFullYear();
  var token = params.get('token') || localStorage.getItem('token');
  var WW = window.WaterworksBillingCommon;
  var api = WW.resolveApiBase();

  if (!accountId || !token) {
    document.getElementById('loadStatus').textContent = 'Missing account_id or token';
    return;
  }

  Promise.all([
    WW.fetchBillingData(api, token, accountId, month, year),
    WW.fetchSettings(api, token)
  ])
    .then(function (results) {
      var payload = results[0];
      var settings = results[1];
      var data = payload.data || {};
      var periodLabel = data.billing_period_label || (WW.MONTHS[month - 1] + ' ' + year);
      document.getElementById('bill-wrap').innerHTML = WW.renderStatement(payload, settings, {
        billingMonth: month,
        billingYear: year
      });
      document.getElementById('bill-wrap').classList.remove('hidden');
      document.getElementById('loadStatus').textContent = data.bill
        ? 'Statement loaded · ' + periodLabel
        : 'No bill for period';
      document.getElementById('btnPrint').disabled = false;
    })
    .catch(function (err) {
      document.getElementById('loadStatus').textContent = 'Error: ' + err.message;
    });
})();
</script>
</body>
</html>
