openapi: 3.0.3
info:
  title: PAMS API
  version: 1.0.0
  description: |
    Permit Assessment & Management System API.
    Phase 1–3 foundations plus Phase 4 deepen: RBAC, pagination,
    jobs, portal, org units, attachments, waterworks module layering.
servers:
  - url: /api
    description: Current API (treated as v1)
  - url: /api/v1
    description: Explicit v1 alias (same handlers)
tags:
  - name: Auth
  - name: Applications
  - name: Tasks
  - name: Jobs
  - name: Portal
  - name: OrgUnits
  - name: Attachments
  - name: Health
  - name: Waterworks
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: JWT and user profile including roles and permissions
  /auth/me:
    get:
      tags: [Auth]
      summary: Current user
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: User with roles and permissions
  /applications:
    get:
      tags: [Applications]
      summary: List applications (paginated)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20, maximum: 100 }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: permit_type
          schema: { type: string }
      responses:
        '200':
          description: Paginated application list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApplications'
  /tasks:
    get:
      tags: [Tasks]
      summary: My Work inbox
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Aggregated pending tasks
  /jobs:
    post:
      tags: [Jobs]
      summary: Enqueue PDF generation job
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, applicationId]
              properties:
                type:
                  type: string
                  enum: [assessment_pdf, permit_pdf]
                applicationId:
                  type: string
      responses:
        '202':
          description: Job accepted
  /jobs/{id}:
    get:
      tags: [Jobs]
      summary: Get job status
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Job status and optional result
  /portal/track:
    get:
      tags: [Portal]
      summary: Public application status lookup
      parameters:
        - in: query
          name: application_number
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Public status payload
        '404':
          description: Not found
  /org-units:
    get:
      tags: [OrgUnits]
      summary: List organizational units
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Org unit list
  /attachments:
    get:
      tags: [Attachments]
      summary: List attachments for a reference
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: module
          required: true
          schema: { type: string }
        - in: query
          name: reference_type
          required: true
          schema: { type: string }
        - in: query
          name: reference_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Attachment metadata list
  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      responses:
        '200':
          description: OK
  /health/detailed:
    get:
      tags: [Health]
      summary: Deep health (DB, disk, queue, ETRACS)
      responses:
        '200':
          description: Detailed checks
        '503':
          description: Unhealthy
  /waterworks/accounts:
    get:
      tags: [Waterworks]
      summary: List consumer accounts (paginated)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: supply_id
          schema: { type: string }
        - in: query
          name: search
          schema: { type: string }
      responses:
        '200':
          description: Paginated accounts
  /waterworks/readings:
    get:
      tags: [Waterworks]
      summary: List meter readings (paginated)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Paginated readings
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Pagination:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
    PaginatedApplications:
      type: object
      properties:
        data:
          type: array
          items: { type: object }
        pagination:
          $ref: '#/components/schemas/Pagination'
    Error:
      type: object
      properties:
        error: { type: string }
